name: Readability CI Fix

on:
  push:
    branches:
      - codex/translation-readability-typesetter
    paths:
      - .github/readability-ci-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/translation-readability-typesetter
      - run: python3 .github/readability-ci-fix.py
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/ReaderView.swift
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: use default readability floor without comic"
          git push origin HEAD:codex/translation-readability-typesetter
