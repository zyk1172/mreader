name: Temporary regression test import fix

on:
  push:
    branches:
      - fix/mobile-reader-regressions-20260913

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix test import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mreaderTests/ReadingActivityStoreTests.swift')
          text = path.read_text(encoding='utf-8')
          old = 'import Foundation\nimport Testing\n'
          new = 'import Foundation\nimport Testing\nimport XCTest\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mreaderTests/ReadingActivityStoreTests.swift
          git commit -m 'test: import XCTest for progress regression coverage'
          git push
