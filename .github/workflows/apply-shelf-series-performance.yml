name: Apply shelf series performance patch

on:
  push:
    branches:
      - codex/shelf-series-performance

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/shelf-series-performance

      - name: Apply targeted patch
        run: python3 scripts/apply_shelf_series_performance.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'let comicIndex = ShelfComicIndex(comics: displayComics)' mreader/ContentView.swift
          if grep -Fq 'displayComics.filter { $0.seriesID == series.id }' mreader/ContentView.swift; then
            exit 1
          fi

      - name: Commit optimized shelf rendering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: index shelf comics by series once"
          git push origin HEAD:codex/shelf-series-performance
