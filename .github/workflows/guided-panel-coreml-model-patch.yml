name: Guided Panel Core ML Model Patch

on:
  push:
    branches:
      - feature/guided-panel-v1
    paths:
      - .github/workflows/guided-panel-coreml-model-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-model:
    runs-on: macos-15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/guided-panel-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exporter
        run: python -m pip install 'numpy==2.3.5' 'ultralytics>=8.4.43,<8.5' 'coremltools==9.0'

      - name: Download checkpoint
        run: curl -L --fail --retry 3 'https://huggingface.co/ShadowB/Manga109-panel-balloon-text-yolov26-segmentation/resolve/main/best.pt?download=true' -o /tmp/manga109-panel-yolo26s-best.pt

      - name: Verify checkpoint
        run: echo '0b4376e426fa96af3976afa6a2602421dacf2dec96ef87b4a44f5e8d4971cb6f  /tmp/manga109-panel-yolo26s-best.pt' | shasum -a 256 -c -

      - name: Export FP16 Core ML model
        run: |
          rm -rf /tmp/panel-export
          mkdir -p /tmp/panel-export
          python "$GITHUB_WORKSPACE/.github/scripts/export_guided_panel_model.py"
          test -d /tmp/panel-export/PanelDetector.mlpackage
          rm -rf "$GITHUB_WORKSPACE/mreader/PanelDetector.mlpackage"
          cp -R /tmp/panel-export/PanelDetector.mlpackage "$GITHUB_WORKSPACE/mreader/PanelDetector.mlpackage"
          du -sh "$GITHUB_WORKSPACE/mreader/PanelDetector.mlpackage"

      - name: Patch detector and tests
        run: python .github/scripts/patch_guided_panel_coreml.py

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/guided-panel-coreml-model-patch.yml
          rm -f .github/scripts/export_guided_panel_model.py
          rm -f .github/scripts/patch_guided_panel_coreml.py
          git add -A
          git status --short
          git commit -m 'feat: bundle Manga109 YOLO26s Core ML panel detector'
          git push origin HEAD:feature/guided-panel-v1
