      "coordinateSpace": "normalized",
      "items": [
        {
          "id": "b0",
          "sourceText": "原文",
          "translation": "译文",
          "translationLines": ["译文"],
          "textBox": {"x": 0.10, "y": 0.20, "width": 0.30, "height": 0.08},
          "bubbleBox": null,
          "layoutSafeRegion": {"x": 0.09, "y": 0.19, "width": 0.32, "height": 0.10},
          "textPolygon": [],
          "bubblePolygon": [],
          "confidence": 0.90,
          "classification": "dialogue"
        }
      ]
    }
    如果没有可翻译文字，输出 {"coordinateSpace":"normalized","items":[]}。
    """

'''
