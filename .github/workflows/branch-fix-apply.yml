name: Finish translation and vision fixes

on:
  push:
    branches:
      - fix/translation-llm-guided-panel-polish
    paths:
      - .github/workflows/branch-fix-apply.yml
      - .github/scripts/apply_translation_ai_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/translation-llm-guided-panel-polish
          fetch-depth: 2
      - name: Apply remaining AI fixes
        run: python3 .github/scripts/apply_translation_ai_fix.py
      - name: Verify patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/AIProviderSettingsView.swift mreader/AITranslator.swift mreaderTests/TranslationOverlayCollisionTests.swift mreaderTests/AIConnectionProbeTests.swift
          git diff --cached --check
          git commit -m "Fix AI probes and vision translation contract"
          git push origin HEAD:fix/translation-llm-guided-panel-polish
