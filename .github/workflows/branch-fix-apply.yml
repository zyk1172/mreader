name: Apply focused reader regression fixes

on:
  push:
    branches:
      - fix/translation-llm-guided-panel-polish
    paths:
      - .github/workflows/branch-fix-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/translation-llm-guided-panel-polish
          fetch-depth: 2
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Restore the classic neutral translation text color.
          replace_once(
              "mreader/ReaderView.swift",
              "color: displayMode == .inPlace ? UIColor.label : style.coreTextColor,",
              "color: displayMode == .inPlace ? UIColor.label : UIColor.black,"
          )

          # 2) Clear the Xcode warning reported by the device build.
          replace_once(
              "mreader/OCRROICoverageGuard.swift",
              "        var regions: [CGRect] = blocks.map { block in",
              "        let regions: [CGRect] = blocks.map { block in"
          )

          # 3) Make collision avoidance search the whole legal region before accepting overlap.
          p = Path("mreader/OCRBubbleLayoutEngine.swift")
          text = p.read_text()
          start = text.index("    static func nonOverlappingRect(")
          final_enum_close = text.rfind("\n}")
          if final_enum_close <= start:
              raise SystemExit("OCRBubbleLayoutEngine.swift: could not isolate collision helpers")
          collision_tail = r'''    static func nonOverlappingRect(
        _ original: CGRect,
        anchor: CGPoint,
        occupiedRects: [CGRect],
        bounds: CGRect,
        margin: CGFloat = 12
    ) -> CGRect {
        let clampedOriginal = clamped(original, to: bounds, margin: margin)
        guard occupiedRects.contains(where: { $0.intersects(clampedOriginal) }) else {
            return clampedOriginal
        }

        // First keep the old local/radial behaviour: it preserves the source anchor when
        // a nearby slot is available. Search farther than before because translated text
        // can be substantially wider than the source glyphs.
        let stepY = max(clampedOriginal.height * 0.85, 22)
        let stepX = max(clampedOriginal.width * 0.45, 32)
        var candidates: [CGRect] = []
        for distance in 1...10 {
            let dy = CGFloat(distance) * stepY
            let dx = CGFloat(distance) * stepX
            candidates.append(clampedOriginal.offsetBy(dx: 0, dy: -dy))
            candidates.append(clampedOriginal.offsetBy(dx: 0, dy: dy))
            candidates.append(clampedOriginal.offsetBy(dx: -dx, dy: 0))
            candidates.append(clampedOriginal.offsetBy(dx: dx, dy: 0))
            candidates.append(clampedOriginal.offsetBy(dx: -dx * 0.65, dy: -dy * 0.65))
            candidates.append(clampedOriginal.offsetBy(dx: dx * 0.65, dy: -dy * 0.65))
            candidates.append(clampedOriginal.offsetBy(dx: -dx * 0.65, dy: dy * 0.65))
            candidates.append(clampedOriginal.offsetBy(dx: dx * 0.65, dy: dy * 0.65))
        }

        // Radial candidates collapse to the same edge when they are clamped. The old
        // implementation could therefore conclude that overlap was unavoidable even
        // though another free slot existed elsewhere in the allowed region. Add a small,
        // deterministic 7x7 packing grid before accepting any overlap.
        let usableBounds = bounds.insetBy(dx: margin, dy: margin)
        let packingBounds = usableBounds.width > 0 && usableBounds.height > 0
            ? usableBounds
            : bounds
        let availableX = max(packingBounds.width - clampedOriginal.width, 0)
        let availableY = max(packingBounds.height - clampedOriginal.height, 0)
        let fractions: [CGFloat] = [0, 1.0 / 6.0, 2.0 / 6.0, 0.5, 4.0 / 6.0, 5.0 / 6.0, 1]
        for y in fractions {
            for x in fractions {
                candidates.append(
                    CGRect(
                        x: packingBounds.minX + availableX * x,
                        y: packingBounds.minY + availableY * y,
                        width: clampedOriginal.width,
                        height: clampedOriginal.height
                    )
                )
            }
        }

        let normalizedCandidates = candidates.map {
            clamped($0, to: bounds, margin: margin)
        }
        if let free = normalizedCandidates
            .filter({ candidate in
                !occupiedRects.contains(where: { $0.intersects(candidate) })
            })
            .min(by: {
                hypot($0.midX - anchor.x, $0.midY - anchor.y)
                    < hypot($1.midX - anchor.x, $1.midY - anchor.y)
            }) {
            return free
        }

        // If the legal region itself is too small to fit both cards, retain the best
        // bounded fallback instead of moving text outside its page/bubble contract.
        return normalizedCandidates.min {
            layoutScore($0, anchor: anchor, occupiedRects: occupiedRects)
                < layoutScore($1, anchor: anchor, occupiedRects: occupiedRects)
        } ?? clampedOriginal
    }

    private static func layoutScore(
        _ rect: CGRect,
        anchor: CGPoint,
        occupiedRects: [CGRect]
    ) -> CGFloat {
        let overlapPenalty = occupiedRects.reduce(CGFloat.zero) { partial, occupied in
            let overlap = rect.intersection(occupied)
            guard !overlap.isNull else { return partial }
            return partial + overlap.width * overlap.height * 90
        }
        return hypot(rect.midX - anchor.x, rect.midY - anchor.y) + overlapPenalty
    }
'''
