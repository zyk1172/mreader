name: Manga Vision Reader Finish

on:
  push:
    branches:
      - feature/manga-vision-layer
    paths:
      - scripts/apply_manga_vision_reader_finish.py
      - .github/workflows/manga-vision-reader-finish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/manga-vision-layer
          fetch-depth: 0
      - name: Apply reader integration finish
        run: python3 scripts/apply_manga_vision_reader_finish.py
      - name: Commit integrated sources
        run: |
          rm scripts/apply_manga_vision_reader_finish.py
          rm .github/workflows/manga-vision-reader-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finish Manga Vision reader integration"
          git push origin feature/manga-vision-layer
