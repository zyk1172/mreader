name: Align vision recognition prompt with schema

on:
  push:
    branches:
      - codex/visual-ocr-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-ocr-reliability
          fetch-depth: 0
      - name: Align recognition contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mreader/AITranslator.swift')
          s = p.read_text()
          old = '''        textBox 紧贴文字；bubbleBox 只在能确认真实物理气泡时返回，无框拟声词必须省略；layoutSafeRegion 始终返回可安全摆放译文的区域；同时尽量返回对应的四点 textPolygon 和 bubblePolygon。\n'''
          new = '''        每个 item 必须包含 textBox、bubbleBox、layoutSafeRegion、textPolygon、bubblePolygon。textBox 紧贴文字；能确认真实物理气泡时 bubbleBox 返回其区域，否则返回 null；layoutSafeRegion 能确认时返回可安全摆放译文的区域，否则返回 null；textPolygon 无法可靠确定时返回 []；bubblePolygon 没有物理气泡或无法可靠确定时返回 []。\n'''
          if s.count(old) != 1:
              raise SystemExit(f'prompt contract match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old_example = '''        {"coordinateSpace":"normalized","items":[{"id":"v1","sourceText":"原文","classification":"dialogue","textBox":{"x":0.1,"y":0.2,"width":0.2,"height":0.08},"bubbleBox":{"x":0.08,"y":0.18,"width":0.24,"height":0.12},"layoutSafeRegion":{"x":0.09,"y":0.19,"width":0.22,"height":0.10},"textPolygon":[{"x":0.1,"y":0.2},{"x":0.3,"y":0.2},{"x":0.3,"y":0.28},{"x":0.1,"y":0.28}],"bubblePolygon":[{"x":0.08,"y":0.18},{"x":0.32,"y":0.18},{"x":0.32,"y":0.3},{"x":0.08,"y":0.3}],"confidence":0.9}]}\n'''
          new_example = '''        {"coordinateSpace":"normalized","items":[{"id":"v1","sourceText":"原文","classification":"dialogue","textBox":{"x":0.1,"y":0.2,"width":0.2,"height":0.08},"bubbleBox":{"x":0.08,"y":0.18,"width":0.24,"height":0.12},"layoutSafeRegion":{"x":0.09,"y":0.19,"width":0.22,"height":0.10},"textPolygon":[{"x":0.1,"y":0.2},{"x":0.3,"y":0.2},{"x":0.3,"y":0.28},{"x":0.1,"y":0.28}],"bubblePolygon":[{"x":0.08,"y":0.18},{"x":0.32,"y":0.18},{"x":0.32,"y":0.3},{"x":0.08,"y":0.3}],"confidence":0.9},{"id":"v2","sourceText":"ドン","classification":"soundEffect","textBox":{"x":0.4,"y":0.4,"width":0.1,"height":0.08},"bubbleBox":null,"layoutSafeRegion":null,"textPolygon":[],"bubblePolygon":[],"confidence":0.8}]}\n'''
          if s.count(old_example) != 1:
              raise SystemExit(f'example match count={s.count(old_example)}')
          s = s.replace(old_example, new_example, 1)
          p.write_text(s)

          t = Path('mreaderTests/VisualOCRContractTests.swift')
          tests = t.read_text()
          old_test = '''        XCTAssertTrue(prompt.contains("textBox"))\n'''
          new_test = '''        XCTAssertTrue(prompt.contains("textBox"))\n        XCTAssertTrue(prompt.contains("bubbleBox 返回其区域，否则返回 null"))\n        XCTAssertTrue(prompt.contains("textPolygon 无法可靠确定时返回 []"))\n        XCTAssertTrue(prompt.contains("bubblePolygon 没有物理气泡或无法可靠确定时返回 []"))\n'''
          if tests.count(old_test) != 1:
              raise SystemExit(f'test marker count={tests.count(old_test)}')
          t.write_text(tests.replace(old_test, new_test, 1))
          PY
          git diff --check
          git diff --stat
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/AITranslator.swift mreaderTests/VisualOCRContractTests.swift
          git commit -m "fix: align vision recognition prompt with schema"
          git rm .github/workflows/apply-vision-recognition-contract.yml
          git commit -m "chore: remove temporary vision contract workflow"
          git push origin HEAD:codex/visual-ocr-reliability
