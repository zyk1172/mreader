name: Apply progress reset follow-up

on:
  push:
    branches:
      - fix/mobile-reader-ux-20260913

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch progress reset edge cases
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'mreader/ComicBook.swift',
              '    /// Minimum point size at which translation is rendered in-place. When a\n'
              '    /// region cannot fit at this size, layout returns `needsExpansion` instead\n'
              '    /// of silently shrinking to microscopic text.\n',
              '    /// Preferred readability floor for in-page translation. Extremely small\n'
              '    /// regions may shrink below this preference so the translation can remain\n'
              '    /// visible in place without an interactive expansion overlay.\n',
              'translation font comment'
          )

          patch(
              'mreader/ComicBook.swift',
              '            furthestPageIndex: min(max(selectedFurthest, selectedPage, 0), pageLimit),\n',
              '            furthestPageIndex: min(max(max(selectedFurthest, selectedPage), 0), pageLimit),\n',
              'nested max compile fix'
          )

          old_client = (
              '    func updateReadProgress(bookID: String, pageIndex: Int, totalPages: Int) async throws {\n'
              '        let completed = pageIndex >= max(totalPages - 1, 0)\n'
              '        let payload = KomgaReadProgressUpdateDTO(pageIndex: pageIndex, completed: completed)\n'
              '        let data = try JSONEncoder().encode(payload)\n'
              '        try await sendNoContent(path: KomgaAPIEndpoint.readProgress(bookID: bookID), method: "PATCH", body: data)\n'
              '    }\n\n'
              '    func deleteBook(bookID: String) async throws {\n'
          )
          new_client = (
              '    func updateReadProgress(bookID: String, pageIndex: Int, totalPages: Int) async throws {\n'
              '        let completed = pageIndex >= max(totalPages - 1, 0)\n'
              '        let payload = KomgaReadProgressUpdateDTO(pageIndex: pageIndex, completed: completed)\n'
              '        let data = try JSONEncoder().encode(payload)\n'
              '        try await sendNoContent(path: KomgaAPIEndpoint.readProgress(bookID: bookID), method: "PATCH", body: data)\n'
              '    }\n\n'
              '    /// Explicit reset differs from a normal page-0 progress update: a one-page\n'
              '    /// book must become incomplete rather than immediately completed again.\n'
              '    func resetReadProgress(bookID: String) async throws {\n'
              '        let payload = KomgaReadProgressUpdateDTO(pageIndex: 0, completed: false)\n'
              '        let data = try JSONEncoder().encode(payload)\n'
              '        try await sendNoContent(path: KomgaAPIEndpoint.readProgress(bookID: bookID), method: "PATCH", body: data)\n'
              '    }\n\n'
              '    func deleteBook(bookID: String) async throws {\n'
          )
          patch('mreader/KomgaAPIClient.swift', old_client, new_client, 'Komga explicit reset client')

          old_provider = (
              '    static func deleteBook(_ comic: ComicBook) async throws {\n'
          )
          new_provider = (
              '    static func resetReadProgress(for comic: ComicBook) async throws {\n'
              '        guard comic.sourceType == .komga,\n'
              '              let sourceID = comic.mediaSourceID,\n'
              '              let bookID = comic.komgaBookID,\n'
              '              let source = await loadSources().first(where: { $0.id == sourceID && $0.type == .komga && $0.isEnabled }) else {\n'
              '            return\n'
              '        }\n'
              '        guard let apiKey = apiKey(for: source.id) else { throw MediaSourceError.apiKeyMissing }\n'
              '        let resolvedURL = await resolveBestURL(source: source)\n'
              '        let client = try KomgaAPIClient(baseURLString: resolvedURL, apiKey: apiKey)\n'
              '        try await client.resetReadProgress(bookID: bookID)\n'
              '    }\n\n'
              '    static func deleteBook(_ comic: ComicBook) async throws {\n'
          )
          patch('mreader/KomgaProvider.swift', old_provider, new_provider, 'Komga reset provider')

          patch(
              'mreader/ContentView.swift',
              '                try await KomgaProvider.updateReadProgress(for: updated)\n',
              '                try await KomgaProvider.resetReadProgress(for: updated)\n',
              'ContentView explicit reset call'
          )

          comic = Path('mreader/ComicBook.swift').read_text(encoding='utf-8')
          client = Path('mreader/KomgaAPIClient.swift').read_text(encoding='utf-8')
          provider = Path('mreader/KomgaProvider.swift').read_text(encoding='utf-8')
          content = Path('mreader/ContentView.swift').read_text(encoding='utf-8')
          assert 'min(max(max(selectedFurthest, selectedPage), 0), pageLimit)' in comic
          assert 'func resetReadProgress(bookID: String)' in client
          assert 'static func resetReadProgress(for comic: ComicBook)' in provider
          assert 'KomgaProvider.resetReadProgress(for: updated)' in content
          PY

      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader
          git diff --cached --check
          git commit -m "fix: harden reading progress reset"
          git push origin HEAD
