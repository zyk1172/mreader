name: Apply progress reset follow-up

on:
  push:
    branches:
      - fix/mobile-reader-ux-20260913

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch progress reset edge cases
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          patch(
              'mreader/ComicBook.swift',
              '''    /// Minimum point size at which translation is rendered in-place. When a
    /// region cannot fit at this size, layout returns `needsExpansion` instead
    /// of silently shrinking to microscopic text.
''',
              '''    /// Preferred readability floor for in-page translation. Extremely small
    /// regions may shrink below this preference so the translation can remain
    /// visible in place without an interactive expansion overlay.
''',
              'translation font comment'
          )

          patch(
              'mreader/ComicBook.swift',
              '            furthestPageIndex: min(max(selectedFurthest, selectedPage, 0), pageLimit),\n',
              '            furthestPageIndex: min(max(max(selectedFurthest, selectedPage), 0), pageLimit),\n',
              'nested max compile fix'
          )

          patch(
              'mreader/KomgaAPIClient.swift',
              '''    func updateReadProgress(bookID: String, pageIndex: Int, totalPages: Int) async throws {
        let completed = pageIndex >= max(totalPages - 1, 0)
        let payload = KomgaReadProgressUpdateDTO(pageIndex: pageIndex, completed: completed)
        let data = try JSONEncoder().encode(payload)
        try await sendNoContent(path: KomgaAPIEndpoint.readProgress(bookID: bookID), method: "PATCH", body: data)
    }

    func deleteBook(bookID: String) async throws {
''',
              '''    func updateReadProgress(bookID: String, pageIndex: Int, totalPages: Int) async throws {
        let completed = pageIndex >= max(totalPages - 1, 0)
        let payload = KomgaReadProgressUpdateDTO(pageIndex: pageIndex, completed: completed)
        let data = try JSONEncoder().encode(payload)
        try await sendNoContent(path: KomgaAPIEndpoint.readProgress(bookID: bookID), method: "PATCH", body: data)
    }

    /// Explicit reset differs from a normal page-0 progress update: a one-page
    /// book must become incomplete rather than immediately completed again.
    func resetReadProgress(bookID: String) async throws {
        let payload = KomgaReadProgressUpdateDTO(pageIndex: 0, completed: false)
        let data = try JSONEncoder().encode(payload)
        try await sendNoContent(path: KomgaAPIEndpoint.readProgress(bookID: bookID), method: "PATCH", body: data)
    }

    func deleteBook(bookID: String) async throws {
''',
              'Komga explicit reset client'
          )

          patch(
              'mreader/KomgaProvider.swift',
              '''    static func updateReadProgress(for comic: ComicBook) async throws {
        guard comic.sourceType == .komga,
              let sourceID = comic.mediaSourceID,
              let bookID = comic.komgaBookID,
              let source = await loadSources().first(where: { $0.id == sourceID && $0.type == .komga && $0.isEnabled }) else {
            return
        }
        guard let apiKey = apiKey(for: source.id) else { throw MediaSourceError.apiKeyMissing }
        let resolvedURL = await resolveBestURL(source: source)
        let client = try KomgaAPIClient(baseURLString: resolvedURL, apiKey: apiKey)
        try await client.updateReadProgress(
            bookID: bookID,
            pageIndex: ReadingProgressMergePolicy.serverPageIndex(for: comic),
            totalPages: comic.totalPages
        )
    }

    static func deleteBook(_ comic: ComicBook) async throws {
''',
              '''    static func updateReadProgress(for comic: ComicBook) async throws {
        guard comic.sourceType == .komga,
              let sourceID = comic.mediaSourceID,
              let bookID = comic.komgaBookID,
              let source = await loadSources().first(where: { $0.id == sourceID && $0.type == .komga && $0.isEnabled }) else {
            return
        }
        guard let apiKey = apiKey(for: source.id) else { throw MediaSourceError.apiKeyMissing }
        let resolvedURL = await resolveBestURL(source: source)
        let client = try KomgaAPIClient(baseURLString: resolvedURL, apiKey: apiKey)
        try await client.updateReadProgress(
            bookID: bookID,
            pageIndex: ReadingProgressMergePolicy.serverPageIndex(for: comic),
            totalPages: comic.totalPages
        )
    }

    static func resetReadProgress(for comic: ComicBook) async throws {
        guard comic.sourceType == .komga,
              let sourceID = comic.mediaSourceID,
              let bookID = comic.komgaBookID,
              let source = await loadSources().first(where: { $0.id == sourceID && $0.type == .komga && $0.isEnabled }) else {
            return
        }
        guard let apiKey = apiKey(for: source.id) else { throw MediaSourceError.apiKeyMissing }
        let resolvedURL = await resolveBestURL(source: source)
        let client = try KomgaAPIClient(baseURLString: resolvedURL, apiKey: apiKey)
        try await client.resetReadProgress(bookID: bookID)
    }

    static func deleteBook(_ comic: ComicBook) async throws {
''',
              'Komga reset provider'
          )

          patch(
              'mreader/ContentView.swift',
              '                try await KomgaProvider.updateReadProgress(for: updated)\n',
              '                try await KomgaProvider.resetReadProgress(for: updated)\n',
              'ContentView explicit reset call'
          )

          comic = Path('mreader/ComicBook.swift').read_text(encoding='utf-8')
          client = Path('mreader/KomgaAPIClient.swift').read_text(encoding='utf-8')
          provider = Path('mreader/KomgaProvider.swift').read_text(encoding='utf-8')
          content = Path('mreader/ContentView.swift').read_text(encoding='utf-8')
          assert 'min(max(max(selectedFurthest, selectedPage), 0), pageLimit)' in comic
          assert 'func resetReadProgress(bookID: String)' in client
          assert 'static func resetReadProgress(for comic: ComicBook)' in provider
          assert 'KomgaProvider.resetReadProgress(for: updated)' in content
          PY

      - name: Commit follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader
          git diff --cached --check
          git commit -m "fix: harden reading progress reset"
          git push origin HEAD
