name: Guided Panel Protocol Rename Patch

on:
  push:
    branches:
      - feature/guided-panel-v1
    paths:
      - .github/workflows/guided-panel-protocol-rename-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-guided-panel-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/guided-panel-v1
          fetch-depth: 0

      - name: Rename detector protocol and harden initialization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mreader/PanelDetectionService.swift')
          text = path.read_text()

          replacements = {
              'nonisolated protocol PanelDetector: Sendable {': 'nonisolated protocol PanelDetecting: Sendable {',
              'nonisolated struct VisionRectanglePanelDetector: PanelDetector {': 'nonisolated struct VisionRectanglePanelDetector: PanelDetecting {',
              'nonisolated struct CoreMLPanelDetector: PanelDetector, @unchecked Sendable {': 'nonisolated struct CoreMLPanelDetector: PanelDetecting, @unchecked Sendable {',
              'private let primaryDetector: any PanelDetector': 'private let primaryDetector: any PanelDetecting',
              'private let fallbackDetector: any PanelDetector': 'private let fallbackDetector: any PanelDetecting',
              'init(detector: (any PanelDetector)? = nil) {': 'init(detector: (any PanelDetecting)? = nil) {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new)

          old_init = '''        fallbackDetector = VisionRectanglePanelDetector()\n        primaryDetector = detector ?? CoreMLPanelDetector.bundled() ?? VisionRectanglePanelDetector()\n        try? fileManager.createDirectory(at: cacheDirectory, withIntermediateDirectories: true)'''
          new_init = '''        fallbackDetector = VisionRectanglePanelDetector()\n        if let detector {\n            primaryDetector = detector\n        } else if let coreMLDetector = CoreMLPanelDetector.bundled() {\n            primaryDetector = coreMLDetector\n        } else {\n            primaryDetector = VisionRectanglePanelDetector()\n        }\n        try? fileManager.createDirectory(at: cacheDirectory, withIntermediateDirectories: true)'''
          if old_init not in text:
              raise SystemExit('missing expected detector initialization block')
          text = text.replace(old_init, new_init, 1)

          path.write_text(text)
          PY

          grep -n 'PanelDetect' mreader/PanelDetectionService.swift | head -n 30

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/guided-panel-protocol-rename-patch.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: avoid Core ML generated detector name collision'
          git push origin HEAD:feature/guided-panel-v1
