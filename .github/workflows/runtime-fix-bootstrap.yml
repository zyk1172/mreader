name: Patch runtime access

on:
  push:
    branches:
      - fix/runtime-log-performance-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-log-performance-cleanup
          fetch-depth: 0
      - name: Apply access patch
        run: python3 .github/scripts/apply-runtime-access-fix.py
      - name: Verify patch
        run: |
          grep -q "securityScopeRequested=" mreader/ComicManager.swift
          grep -q "options: .minimalBookmark" mreader/ComicManager.swift
          test -f mreaderTests/RuntimeAccessPolicyTests.swift
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-fix-bootstrap.yml .github/scripts/apply-runtime-access-fix.py
          git add mreader/ComicManager.swift mreaderTests/RuntimeAccessPolicyTests.swift
          git commit -m "Fix security-scoped resource handling"
          git push origin HEAD:fix/runtime-log-performance-cleanup
