name: Codex guided page-boundary fix

on:
  push:
    branches:
      - fix/guided-panel-liquid-glass-prefetch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guided-panel-liquid-glass-prefetch
          fetch-depth: 0
      - name: Apply page-boundary patch
        run: python3 .github/codex_guided_page_boundary_patch.py
      - name: Commit patch and clean helper files
        run: |
          rm .github/codex_guided_page_boundary_patch.py
          rm .github/workflows/codex-guided-page-boundary-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep guided panel visible while next page prepares"
          git push origin HEAD:fix/guided-panel-liquid-glass-prefetch
