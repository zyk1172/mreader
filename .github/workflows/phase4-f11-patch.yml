name: Phase 4 display integration

on:
  push:
    branches:
      - codex/translation-comic-integration
    paths:
      - .github/workflows/phase4-f11-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: codex/translation-comic-integration
          fetch-depth: 0

      - name: Repair settings anchor and apply F11 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/phase4_f11_patch.py')
          s = p.read_text()
          old = '''anchor = ''' + "'''" + '''                            Text("ocr.minimumReadableTranslationFontSizeDescription".localized)\n                                .font(.caption)\n                                .foregroundStyle(.secondary)''' + "'''" + '''\nif anchor not in s:\n    raise SystemExit('missing anchor: reader readable-floor description')\ninsert = anchor + ''' + "'''" + '''\n\n                            Toggle("ocr.inPlaceTranslation".localized, isOn: Binding(\n                                get: { comic?.prefersInPlaceTranslation ?? false },\n                                set: { newValue in\n                                    comic?.prefersInPlaceTranslation = newValue\n                                    persistReaderComicSettings()\n                                }\n                            ))\n                            Text("ocr.inPlaceTranslationDescription".localized)\n                                .font(.caption)\n                                .foregroundStyle(.secondary)''' + "'''" + '''\ns = s.replace(anchor, insert, 1)\np.write_text(s)'''
          new = '''anchor = ''' + "'''" + '''                        Text("ocr.minimumReadableTranslationFontSizeDescription".localized)\n                            .font(.caption)\n                            .foregroundStyle(.secondary)''' + "'''" + '''\nif anchor not in s:\n    raise SystemExit('missing anchor: reader readable-floor description')\ninsert = anchor + ''' + "'''" + '''\n\n                        Toggle("ocr.inPlaceTranslation".localized, isOn: Binding(\n                            get: { comic.prefersInPlaceTranslation },\n                            set: { newValue in updateComic { $0.prefersInPlaceTranslation = newValue } }\n                        ))\n                        .disabled(!comic.isAITranslationEnabled)\n                        Text("ocr.inPlaceTranslationDescription".localized)\n                            .font(.caption)\n                            .foregroundStyle(.secondary)''' + "'''" + '''\ns = s.replace(anchor, insert, 1)\np.write_text(s)'''
          if old not in s:
              raise SystemExit('settings patch block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 .github/phase4_f11_patch.py

      - name: Commit and clean helpers
        shell: bash
        run: |
          rm -f .github/phase4_f11_patch.py .github/workflows/phase4-f11-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate manga-aware translation display modes'
          git push origin HEAD:codex/translation-comic-integration
