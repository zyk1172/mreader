name: Fix Guided Panel CI compile blockers

on:
  push:
    branches:
      - feat/guided-panel-vision-motion-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/guided-panel-vision-motion-v2
          fetch-depth: 0

      - name: Apply compile and strict-concurrency fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "mreader/MangaPageStructureGraph.swift",
              '''    static let empty = MangaPageStructureGraph(
                  nodes: [],
                  unassignedBalloons: [],
                  unassignedTexts: []
              )

              init(
                  panels: [DetectedPanel],
''',
              '''    static let empty = MangaPageStructureGraph(
                  nodes: [],
                  unassignedBalloons: [],
                  unassignedTexts: []
              )

              private init(
                  nodes: [MangaPanelStructureNode],
                  unassignedBalloons: [CGRect],
                  unassignedTexts: [CGRect]
              ) {
                  self.nodes = nodes
                  self.unassignedBalloons = unassignedBalloons
                  self.unassignedTexts = unassignedTexts
              }

              init(
                  panels: [DetectedPanel],
'''
          )

          # Both mutable statics below are already protected by NSLock. Tell Swift's
          # strict-concurrency checker about that external synchronization rather than
          # changing synchronous hot paths into actor hops.
          replace_once(
              "mreader/AppleOCRReference.swift",
              "    private static var processCapability: ProcessCapability = .unknown\n",
              "    nonisolated(unsafe) private static var processCapability: ProcessCapability = .unknown\n"
          )
          replace_once(
              "mreader/ComicManager.swift",
              "    private static var loggedDecisions: Set<String> = []\n",
              "    nonisolated(unsafe) private static var loggedDecisions: Set<String> = []\n"
          )

          # Avoid storing a non-Sendable FileManager singleton in shared static state.
          # A short-lived instance per access preserves the synchronous API and removes
          # the strict-concurrency diagnostic without actor isolation.
          replace_once(
              "mreader/CacheStorageManager.swift",
              "    private static let fileManager = FileManager.default\n",
              "    private static var fileManager: FileManager { FileManager() }\n"
          )
          PY

          git diff --check
          git diff -- mreader/MangaPageStructureGraph.swift mreader/AppleOCRReference.swift mreader/CacheStorageManager.swift mreader/ComicManager.swift

      - name: Commit production fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/MangaPageStructureGraph.swift mreader/AppleOCRReference.swift mreader/CacheStorageManager.swift mreader/ComicManager.swift
          git commit -m "fix: unblock Guided Panel strict-concurrency build"
          git push origin HEAD:feat/guided-panel-vision-motion-v2
