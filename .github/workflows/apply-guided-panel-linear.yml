name: Apply guided panel linear motion patch

on:
  push:
    branches:
      - fix/shelf-scroll-guided-panel-motion-haptics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/shelf-scroll-guided-panel-motion-haptics

      - name: Apply focused ReaderView patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('mreader/ReaderView.swift')
          text = path.read_text()

          move_pattern = re.compile(
              r'(?ms)^    private func moveWithinPage\(to targetIndex: Int\) \{.*?(?=^    private func moveToPage\()'
          )
          move_match = move_pattern.search(text)
          if not move_match:
              raise SystemExit('expected ReaderView block not found: moveWithinPage')

          move_lines = [
              '    private func moveWithinPage(to targetIndex: Int) {',
              '        guard let layout,',
              '              layout.panelRects.indices.contains(panelIndex),',
              '              layout.panelRects.indices.contains(targetIndex) else { return }',
              '        let sourceRect = layout.panelRects[panelIndex]',
              '        let destinationRect = layout.panelRects[targetIndex]',
              '        let profile = GuidedPanelMotionPlanner.profile(',
              '            from: sourceRect,',
              '            to: destinationRect',
              '        )',
              '        HapticManager.shared.play(.light)',
              '        panelMotionTask?.cancel()',
              '',
              '        guard !reduceMotion else {',
              '            panelIndex = targetIndex',
              '            cameraFocusOverride = nil',
              '            return',
              '        }',
              '',
              '        // Keep one uninterrupted camera path. The previous bridge + settle',
              '        // sequence introduced a velocity discontinuity and made direction',
              '        // harder to track. Linear interpolation gives constant-speed travel.',
              '        isPanelTransitioning = true',
              '        withAnimation(.linear(duration: profile.duration)) {',
              '            panelIndex = targetIndex',
              '            cameraFocusOverride = nil',
              '        }',
              '        panelMotionTask = Task { @MainActor in',
              '            try? await Task.sleep(for: .seconds(profile.duration))',
              '            guard !Task.isCancelled else { return }',
              '            isPanelTransitioning = false',
              '        }',
              '    }',
              '',
          ]
          text = move_pattern.sub('\n'.join(move_lines), text, count=1)

          page_pattern = re.compile(
              r'(?ms)^    private func moveToPage\(_ pageIndex: Int, enterAtLastPanel: Bool\) \{.*?(?=^    private func cameraAnimation\()'
          )
          page_match = page_pattern.search(text)
          if not page_match:
              raise SystemExit('expected ReaderView block not found: moveToPage')
          page_block = page_match.group(0)
          required = [
              'withAnimation(.easeOut(duration: profile.bridgeDuration))',
              'withAnimation(.easeInOut(duration: 0.30))',
              'try? await Task.sleep(for: .milliseconds(300))',
          ]
          for value in required:
              if value not in page_block:
                  raise SystemExit(f'expected moveToPage fragment not found: {value}')
          page_block = page_block.replace(
              'withAnimation(.easeOut(duration: profile.bridgeDuration))',
              'withAnimation(.linear(duration: profile.bridgeDuration))',
              1,
          )
          page_block = page_block.replace(
              'withAnimation(.easeInOut(duration: 0.30))',
              'let pageSlideDuration: TimeInterval = 0.45\n            withAnimation(.linear(duration: pageSlideDuration))',
              1,
          )
          page_block = page_block.replace(
              'try? await Task.sleep(for: .milliseconds(300))',
              'try? await Task.sleep(for: .seconds(pageSlideDuration))',
              1,
          )
          text = text[:page_match.start()] + page_block + text[page_match.end():]

          animation_pattern = re.compile(
              r'(?ms)^    private func cameraAnimation\(.*?^    \}\n(?=^\}\n\nprivate extension Collection)'
          )
          if not animation_pattern.search(text):
              raise SystemExit('expected ReaderView block not found: cameraAnimation')
          animation_lines = [
              '    private func cameraAnimation(',
              '        for profile: GuidedPanelMotionProfile,',
              '        duration overrideDuration: TimeInterval? = nil',
              '    ) -> Animation? {',
              '        guard !reduceMotion else { return nil }',
              '        return .linear(duration: overrideDuration ?? profile.duration)',
              '    }',
          ]
          text = animation_pattern.sub('\n'.join(animation_lines) + '\n', text, count=1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-guided-panel-linear.yml
          git add mreader/ReaderView.swift
          git diff --check
          git commit -m "Use constant-speed guided panel camera motion"
          git push origin HEAD:fix/shelf-scroll-guided-panel-motion-haptics
