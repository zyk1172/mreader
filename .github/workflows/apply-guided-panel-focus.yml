name: Apply Guided Panel Focus Patch

on:
  push:
    branches:
      - feature/guided-panel-focus-blur
    paths:
      - mreader/GuidedPanelFocus.swift
      - .github/workflows/apply-guided-panel-focus.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guided-panel-focus-blur
          fetch-depth: 0

      - name: Patch GuidedPanelReader
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('mreader/ReaderView.swift')
          text = path.read_text()
          marker = '@State private var focusStore = GuidedPanelFocusPreviewStore()'
          if marker in text:
              print('Guided Panel focus patch already applied')
              raise SystemExit(0)

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    @State private var layoutStore = GuidedPanelLayoutStore()\n    @State private var pageTransitionTarget: GuidedPanelPageTransitionTarget?\n''',
              '''    @State private var layoutStore = GuidedPanelLayoutStore()\n    @State private var focusStore = GuidedPanelFocusPreviewStore()\n    @State private var pageTransitionTarget: GuidedPanelPageTransitionTarget?\n''',
              'focus store state'
          )

          replace_once(
              '''                    .task(id: "\\(page.url.absoluteString)|\\(readingDirection.rawValue)") {\n                        await detectPanels(for: page)\n                    }\n                }\n\n                if let transitionTarget = pageTransitionTarget,\n''',
              '''                    .task(id: "\\(page.url.absoluteString)|\\(readingDirection.rawValue)") {\n                        await detectPanels(for: page)\n                    }\n\n                    // Focus isolation is a cheap overlay: the source page remains untouched.\n                    // The blur texture is precomputed off the tap path; until it is ready this\n                    // automatically falls back to the dim-only layer.\n                    GuidedPanelFocusOverlay(\n                        preview: focusStore.preview(for: page.url),\n                        normalizedPanel: currentFocusPanelRect,\n                        sourceSize: sourceSize,\n                        viewportSize: proxy.size,\n                        cameraScale: camera.scale,\n                        cameraOffset: camera.offset,\n                        opacity: pageTransitionTarget == nil ? 1 : max(0, 1 - pageTransitionProgress)\n                    )\n                }\n\n                if let transitionTarget = pageTransitionTarget,\n''',
              'current page focus overlay'
          )

          replace_once(
              '''                        .opacity(pageTransitionProgress)\n                        .allowsHitTesting(false)\n                        .accessibilityHidden(true)\n                }\n\n                if isDetecting {\n''',
              '''                        .opacity(pageTransitionProgress)\n                        .allowsHitTesting(false)\n                        .accessibilityHidden(true)\n\n                    if pages.indices.contains(transitionTarget.pageIndex) {\n                        let transitionURL = pages[transitionTarget.pageIndex].url\n                        GuidedPanelFocusOverlay(\n                            preview: focusStore.preview(for: transitionURL),\n                            normalizedPanel: focusPanelRect(\n                                for: transitionTarget.entry,\n                                panelIndex: transitionTarget.panelIndex\n                            ),\n                            sourceSize: transitionTarget.entry.sourceSize,\n                            viewportSize: proxy.size,\n                            cameraScale: transitionCamera.scale,\n                            cameraOffset: transitionCamera.offset,\n                            opacity: pageTransitionProgress\n                        )\n                    }\n                }\n\n                if isDetecting {\n''',
              'buffered page focus overlay'
          )

          replace_once(
              '''            layoutStore.pending.removeAll()\n            layoutStore.scheduled.removeAll()\n            pageTransitionTarget = nil\n''',
              '''            layoutStore.pending.removeAll()\n            layoutStore.scheduled.removeAll()\n            focusStore.cancelAll()\n            pageTransitionTarget = nil\n''',
              'focus task cleanup'
          )

          replace_once(
              '''        // Prefer the registered page geometry: it is already known for archive and\n''',
              '''        // Reuse the already-decoded Guided Panel image. Preview generation is queued\n        // on its own actor and never delays layout detection or the camera animation.\n        focusStore.prewarm(url: pageURL, image: image)\n\n        // Prefer the registered page geometry: it is already known for archive and\n''',
              'current page prewarm'
          )

          replace_once(
              '''        guard !Task.isCancelled else { return }\n        let sourceSize = PageGeometryStore.shared.size(for: page.url) ?? CGSize(\n''',
              '''        guard !Task.isCancelled else { return }\n        // N+1/N+2 layout prefetch already owns this decoded image, so focus preview\n        // generation adds no disk/network read and stays completely off the tap path.\n        focusStore.prewarm(url: page.url, image: image)\n        let sourceSize = PageGeometryStore.shared.size(for: page.url) ?? CGSize(\n''',
              'prefetched page prewarm'
          )

          replace_once(
              '''    private func panelTransform(\n        for entry: GuidedPanelLayoutStore.Entry,\n''',
              '''    private var currentFocusPanelRect: CGRect? {\n        guard let layout else { return nil }\n        return layout.panelRects.indices.contains(panelIndex)\n            ? layout.panelRects[panelIndex]\n            : layout.contentBounds.cgRect\n    }\n\n    private func focusPanelRect(\n        for entry: GuidedPanelLayoutStore.Entry,\n        panelIndex: Int\n    ) -> CGRect {\n        entry.layout.panelRects.indices.contains(panelIndex)\n            ? entry.layout.panelRects[panelIndex]\n            : entry.layout.contentBounds.cgRect\n    }\n\n    private func panelTransform(\n        for entry: GuidedPanelLayoutStore.Entry,\n''',
              'focus panel geometry helpers'
          )

          path.write_text(text)
          print('Guided Panel focus patch applied')
          PY

          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/ReaderView.swift
          git commit -m "Integrate guided panel focus isolation"
          git push origin HEAD:feature/guided-panel-focus-blur
