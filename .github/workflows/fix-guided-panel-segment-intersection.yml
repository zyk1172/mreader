name: Fix Guided Panel segment intersection

on:
  push:
    branches:
      - feat/guided-panel-vision-motion-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guided-panel-vision-motion-v2
          fetch-depth: 0
      - name: Patch geometry predicate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mreader/PanelReadingOrder.swift')
          text = p.read_text()
          start = text.index('    private static func segmentsIntersect(')
          end = text.index('\n    private static func pointInPolygon', start)
          new = '''    private static func segmentsIntersect(
              _ a: CGPoint,
              _ b: CGPoint,
              _ c: CGPoint,
              _ d: CGPoint
          ) -> Bool {
              let epsilon: CGFloat = 0.000_001

              func orientation(_ p: CGPoint, _ q: CGPoint, _ r: CGPoint) -> CGFloat {
                  (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x)
              }

              func isOnSegment(_ point: CGPoint, from start: CGPoint, to end: CGPoint) -> Bool {
                  point.x >= min(start.x, end.x) - epsilon
                      && point.x <= max(start.x, end.x) + epsilon
                      && point.y >= min(start.y, end.y) - epsilon
                      && point.y <= max(start.y, end.y) + epsilon
              }

              let o1 = orientation(a, b, c)
              let o2 = orientation(a, b, d)
              let o3 = orientation(c, d, a)
              let o4 = orientation(c, d, b)
              let abStraddles = (o1 > epsilon && o2 < -epsilon)
                  || (o1 < -epsilon && o2 > epsilon)
              let cdStraddles = (o3 > epsilon && o4 < -epsilon)
                  || (o3 < -epsilon && o4 > epsilon)
              if abStraddles && cdStraddles { return true }

              if abs(o1) <= epsilon, isOnSegment(c, from: a, to: b) { return true }
              if abs(o2) <= epsilon, isOnSegment(d, from: a, to: b) { return true }
              if abs(o3) <= epsilon, isOnSegment(a, from: c, to: d) { return true }
              if abs(o4) <= epsilon, isOnSegment(b, from: c, to: d) { return true }
              return false
          }
          '''
          p.write_text(text[:start] + new + text[end:])
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/PanelReadingOrder.swift
          git commit -m "fix: make panel contour intersection robust"
          git push origin HEAD:feat/guided-panel-vision-motion-v2
