name: Execute Guided Panel v2 production patch

on:
  push:
    branches:
      - feat/guided-panel-vision-motion-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guided-panel-vision-motion-v2
          fetch-depth: 0
      - name: Execute production patch without workflow mutation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/guided-panel-v2-patch.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          script = script.replace("if count != 1:", "if count < 1:")
          script = script.replace("text.replace(old, new, 1)", "text.replace(old, new)")
          removal = '''# Remove this one-shot workflow from the production diff.\nworkflow = Path(".github/workflows/guided-panel-v2-patch.yml")\nif workflow.exists():\n    workflow.unlink()\n'''
          script = script.replace(removal, "")
          exec(compile(script, '<guided-panel-v2-patch>', 'exec'), {})
          PY
          git diff --check
          git status --short
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader
          git commit -m "feat: integrate Manga Vision Guided Panel v2"
          git push origin HEAD:feat/guided-panel-vision-motion-v2
