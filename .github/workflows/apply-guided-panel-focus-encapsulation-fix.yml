name: Apply Guided Panel Focus Encapsulation Fix

on:
  push:
    branches:
      - feature/guided-panel-focus-blur
    paths:
      - .github/workflows/apply-guided-panel-focus-encapsulation-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guided-panel-focus-blur
          fetch-depth: 0

      - name: Keep ReaderImageCache encapsulated
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          focus_path = Path('mreader/GuidedPanelFocus.swift')
          focus = focus_path.read_text()
          focus = replace_once(
              focus,
              '''    /// Reuses only an already-decoded ReaderImageCache entry. This is safe to call when a\n    /// cached panel layout is restored or when system power/thermal pressure recovers.\n    func prewarmCached(url: URL) {\n        let key = url.absoluteString\n        guard previews[key] == nil, !inFlight.contains(key) else { return }\n        guard let image = ReaderImageCache.shared.cachedImage(\n            for: url,\n            maxPixelSize: ReaderImageCache.fitScreenMaxPixelSize\n        ) else { return }\n        prewarm(url: url, image: image)\n    }\n\n    func handleSystemModeChange(_ mode: GuidedPanelFocusPolicy.Mode, activeURL: URL) {\n        switch mode {\n        case .blurred:\n            prewarmCached(url: activeURL)\n        case .dimOnly:\n            // Stop queued work immediately. Cached previews are retained but hidden so returning\n            // to normal power/thermal state is instant and does not require another blur pass.\n            cancelAll()\n        }\n    }\n\n''',
              '',
              'remove ReaderImageCache coupling'
          )
          focus = replace_once(
              focus,
              '''    let store: GuidedPanelFocusPreviewStore\n    let pageURL: URL\n    let normalizedPanel: CGRect?\n''',
              '''    let store: GuidedPanelFocusPreviewStore\n    let pageURL: URL\n    let requestPreview: () -> Void\n    let cancelPreviewWork: () -> Void\n    let normalizedPanel: CGRect?\n''',
              'overlay callbacks'
          )
          focus = replace_once(
              focus,
              '''            .task(id: pageURL.absoluteString) {\n                if mode == .blurred {\n                    store.prewarmCached(url: pageURL)\n                }\n            }\n''',
              '''            .task(id: pageURL.absoluteString) {\n                if mode == .blurred {\n                    requestPreview()\n                }\n            }\n''',
              'overlay task callback'
          )
          focus = replace_once(
              focus,
              '''        mode = nextMode\n        store.handleSystemModeChange(nextMode, activeURL: pageURL)\n''',
              '''        mode = nextMode\n        switch nextMode {\n        case .blurred:\n            requestPreview()\n        case .dimOnly:\n            // Stop queued work immediately. Cached previews remain hidden and reusable.\n            cancelPreviewWork()\n        }\n''',
              'system mode callbacks'
          )
          focus_path.write_text(focus)

          reader_path = Path('mreader/ReaderView.swift')
          reader = reader_path.read_text()
          reader = replace_once(
              reader,
              '''                    GuidedPanelFocusOverlay(\n                        store: focusStore,\n                        pageURL: page.url,\n                        normalizedPanel: currentFocusPanelRect,\n''',
              '''                    GuidedPanelFocusOverlay(\n                        store: focusStore,\n                        pageURL: page.url,\n                        requestPreview: { prewarmFocusPreviewIfCached(for: page.url) },\n                        cancelPreviewWork: { focusStore.cancelAll() },\n                        normalizedPanel: currentFocusPanelRect,\n''',
              'current overlay callbacks'
          )
          reader = replace_once(
              reader,
              '''                        GuidedPanelFocusOverlay(\n                            store: focusStore,\n                            pageURL: transitionURL,\n                            normalizedPanel: focusPanelRect(\n''',
              '''                        GuidedPanelFocusOverlay(\n                            store: focusStore,\n                            pageURL: transitionURL,\n                            requestPreview: { prewarmFocusPreviewIfCached(for: transitionURL) },\n                            cancelPreviewWork: { focusStore.cancelAll() },\n                            normalizedPanel: focusPanelRect(\n''',
              'transition overlay callbacks'
          )
          reader = replace_once(
              reader,
              '''            focusStore.prewarmCached(url: pageURL)\n''',
              '''            prewarmFocusPreviewIfCached(for: pageURL)\n''',
              'cached layout recovery'
          )
          reader = replace_once(
              reader,
              '''    private var currentFocusPanelRect: CGRect? {\n''',
              '''    private func prewarmFocusPreviewIfCached(for url: URL) {\n        guard let image = ReaderImageCache.shared.cachedImage(\n            for: url,\n            maxPixelSize: ReaderImageCache.fitScreenMaxPixelSize\n        ) else { return }\n        focusStore.prewarm(url: url, image: image)\n    }\n\n    private var currentFocusPanelRect: CGRect? {\n''',
              'reader cache bridge'
          )
          reader_path.write_text(reader)
          PY

          rm .github/workflows/apply-guided-panel-focus-encapsulation-fix.yml
          git diff --check

      - name: Commit encapsulation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/GuidedPanelFocus.swift mreader/ReaderView.swift .github/workflows/apply-guided-panel-focus-encapsulation-fix.yml
          git commit -m "Keep guided panel cache access encapsulated"
          git push origin HEAD:feature/guided-panel-focus-blur
