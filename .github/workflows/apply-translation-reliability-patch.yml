name: Translation Reliability Patch

on:
  push:
    branches:
      - codex/translation-contract-reliability
    paths:
      - .github/translation-reliability-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/translation-contract-reliability
      - name: Apply patch
        run: python3 .github/translation-reliability-patch.py
      - name: Validate whitespace
        run: git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/AITranslator.swift mreader/AIPageTranslation.swift mreader/AITranslationPageCoordinator.swift mreaderTests/TranslationReliabilityRegressionTests.swift
          git commit -m "fix: harden translation result contract"
          git push origin HEAD:codex/translation-contract-reliability
