name: Phase 3 scope fix

on:
  push:
    branches:
      - codex/translation-context-recovery
    paths:
      - .github/workflows/phase3-scope-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/translation-context-recovery
          fetch-depth: 0
      - name: Apply narrow compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          reader = Path('mreader/ReaderView.swift')
          text = reader.read_text()

          cloud_start = text.index('private func cloudFallbackForMissing(')
          cloud_end = text.index('private func makeTranslationPageRequest', cloud_start)
          cloud = text[cloud_start:cloud_end]
          cloud, count = re.subn(
              r'pageBlocks:\s*blocks\s*\n\s*\),',
              'pageBlocks: pageSnapshot,\n                        requestedIndexes: pageSnapshot.indices.filter { index in\n                            missingIDs.contains(pageSnapshot[index].id)\n                        }\n                    ),',
              cloud,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'cloud fallback replacement count={count}')
          text = text[:cloud_start] + cloud + text[cloud_end:]

          ocr_start = text.index('private func startOCRTextTranslation(')
          ocr_end = text.index('private func recognizedPipelineResult', ocr_start)
          ocr = text[ocr_start:ocr_end]
          pattern = re.compile(
              r'pageBlocks:\s*pageSnapshot,\s*\n\s*requestedIndexes:\s*pageSnapshot\.indices\.filter\s*\{\s*index\s+in\s*\n\s*missingIDs\.contains\(pageSnapshot\[index\]\.id\)\s*\n\s*\}'
          )
          ocr, count = pattern.subn(
              'pageBlocks: blocks,\n                        requestedIndexes: Array(blocks.indices)',
              ocr,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'OCR page replacement count={count}')
          text = text[:ocr_start] + ocr + text[ocr_end:]
          reader.write_text(text)

          context = Path('mreader/TranslationContext.swift')
          ctext = context.read_text()
          if 'import CoreGraphics\n' not in ctext:
              ctext = ctext.replace('import CryptoKit\n', 'import CoreGraphics\nimport CryptoKit\n', 1)
          context.write_text(ctext)
          PY
          rm .github/workflows/phase3-scope-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mreader/ReaderView.swift mreader/TranslationContext.swift .github/workflows/phase3-scope-fix.yml
          git commit -m 'fix: repair phase 3 context compile scopes'
          git push origin HEAD:codex/translation-context-recovery
