name: Translation Partial-State Patch

on:
  push:
    branches:
      - codex/translation-contract-reliability
    paths:
      - .github/translation-partial-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/translation-contract-reliability
      - run: python3 .github/translation-partial-patch.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/AITranslator.swift mreader/TranslationRuntimeService.swift mreader/AITranslationPageCoordinator.swift mreaderTests/TranslationReliabilityRegressionTests.swift
          git commit -m "fix: preserve vision partial state"
          git push origin HEAD:codex/translation-contract-reliability
