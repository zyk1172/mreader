name: Apply real vision connection probe

on:
  push:
    branches:
      - codex/visual-ocr-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-ocr-reliability
          fetch-depth: 0

      - name: Patch vision connection test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mreader/AIProviderSettingsView.swift')
          text = path.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          marker = 'struct AIProviderSettingsView: View {\n'
          helper = '''nonisolated enum AIVisionConnectionProbe {
              static let prompt = "读取图片中央的 6 位大写字母/数字验证码。答案只存在于图片中。只返回你看到的验证码，不要解释。"

              static func makeChallengeCode(length: Int = 6) -> String {
                  let alphabet = Array("ABCDEFGHJKLMNPQRSTUVWXYZ23456789")
                  return String((0..<max(length, 1)).compactMap { _ in alphabet.randomElement() })
              }

              static func response(_ response: String, contains challenge: String) -> Bool {
                  let expected = normalizedASCIIAlphanumerics(challenge)
                  guard !expected.isEmpty else { return false }
                  return normalizedASCIIAlphanumerics(response).contains(expected)
              }

              private static func normalizedASCIIAlphanumerics(_ value: String) -> String {
                  value.uppercased().unicodeScalars
                      .filter { $0.value < 128 && CharacterSet.alphanumerics.contains($0) }
                      .map(String.init)
                      .joined()
              }
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit(f'view marker count={text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          one(
          '''                let request: AITransportRequest
                          let expectedItems = [
          ''',
          '''                let request: AITransportRequest
                          let visionChallenge = kind == .vision ? AIVisionConnectionProbe.makeChallengeCode() : nil
                          let expectedItems = [
          ''',
          'vision challenge declaration')

          one(
          '''                if kind == .vision {
                              guard let imageURL = tinyPNGDataURL() else {
                                  throw AITranslationRequestError.invalidConfiguration("settings.imageEncodingFailed".localized)
                              }
                              request = AITransportRequest(
                                  model: modelDescriptor,
                                  userPrompt: "Return OK.",
                                  imageDataURL: imageURL,
                                  maxTokens: 8,
                                  timeout: AITranslationRequestPolicy.connectionTestTimeout,
                                  kind: .connectionTest
                              )
                          } else {
          ''',
          '''                if kind == .vision {
                              guard let challenge = visionChallenge,
                                    let imageURL = visionProbePNGDataURL(code: challenge) else {
                                  throw AITranslationRequestError.invalidConfiguration("settings.imageEncodingFailed".localized)
                              }
                              request = AITransportRequest(
                                  model: modelDescriptor,
                                  userPrompt: AIVisionConnectionProbe.prompt,
                                  imageDataURL: imageURL,
                                  maxTokens: 32,
                                  timeout: AITranslationRequestPolicy.connectionTestTimeout,
                                  kind: .connectionTest
                              )
                          } else {
          ''',
          'vision request')

          one(
          '''                if kind == .text {
                              let decoded = AIChatResponseDecoder.decode(data)
          ''',
          '''                if kind == .vision {
                              let decoded = AIChatResponseDecoder.decode(data)
                              guard let challenge = visionChallenge,
                                    let content = decoded.content else {
                                  testFailed = true
                                  testMessage = "视觉请求已返回，但没有可验证的文本响应。请检查视觉模型和 API 协议。"
                                  HapticManager.shared.play(.error)
                                  return
                              }
                              guard AIVisionConnectionProbe.response(content, contains: challenge) else {
                                  testFailed = true
                                  let excerpt = String(content.prefix(160)).replacingOccurrences(of: "\\n", with: " ")
                                  testMessage = "视觉接口可连接，但模型没有读出测试图片中的验证码。请检查视觉模型和 API 协议。返回：\\(excerpt)"
                                  HapticManager.shared.play(.error)
                                  return
                              }
                              if modelDescriptor.supportsVision != true {
                                  modelDescriptors[model] = AIModelDescriptor(
                                      id: modelDescriptor.id,
                                      apiProtocol: modelDescriptor.apiProtocol,
                                      supportsVision: true
                                  )
                              }
                          } else {
                              let decoded = AIChatResponseDecoder.decode(data)
          ''',
          'vision response verification')

          old_image = '''    private func tinyPNGDataURL() -> String? {
                  let size = 32
                  let renderer = UIGraphicsImageRenderer(size: CGSize(width: size, height: size))
                  let image = renderer.image { context in
                      UIColor.gray.setFill()
                      context.fill(CGRect(x: 0, y: 0, width: size, height: size))
                  }
                  guard let data = image.pngData() else { return nil }
                  return "data:image/png;base64,\\(data.base64EncodedString())"
              }
          '''
          new_image = '''    private func visionProbePNGDataURL(code: String) -> String? {
                  let size = CGSize(width: 360, height: 180)
                  let renderer = UIGraphicsImageRenderer(size: size)
                  let image = renderer.image { context in
                      UIColor.white.setFill()
                      context.fill(CGRect(origin: .zero, size: size))

                      let paragraph = NSMutableParagraphStyle()
                      paragraph.alignment = .center
                      let attributes: [NSAttributedString.Key: Any] = [
                          .font: UIFont.monospacedSystemFont(ofSize: 56, weight: .bold),
                          .foregroundColor: UIColor.black,
                          .paragraphStyle: paragraph
                      ]
                      (code as NSString).draw(
                          in: CGRect(x: 12, y: 52, width: size.width - 24, height: 76),
                          withAttributes: attributes
                      )
                  }
                  guard let data = image.pngData() else { return nil }
                  return "data:image/png;base64,\\(data.base64EncodedString())"
              }
          '''
          one(old_image, new_image, 'probe image')
          path.write_text(text)

          test_path = Path('mreaderTests/VisualOCRReliabilityTests.swift')
          tests = test_path.read_text()
          extra = '''
              func testVisionConnectionProbeAcceptsCodeReadFromImage() {
                  XCTAssertTrue(AIVisionConnectionProbe.response("7KQ9XZ", contains: "7KQ9XZ"))
                  XCTAssertTrue(AIVisionConnectionProbe.response("The code is: 7kq-9xz.", contains: "7KQ9XZ"))
              }

              func testVisionConnectionProbeRejectsTextOnlyOrWrongAnswers() {
                  XCTAssertFalse(AIVisionConnectionProbe.response("OK", contains: "7KQ9XZ"))
                  XCTAssertFalse(AIVisionConnectionProbe.response("无法读取图片", contains: "7KQ9XZ"))
                  XCTAssertFalse(AIVisionConnectionProbe.response("7KQ9XY", contains: "7KQ9XZ"))
              }
          '''
          stripped = tests.rstrip()
          if not stripped.endswith('}'):
              raise SystemExit('test file closing brace not found')
          stripped = stripped[:-1].rstrip()
          test_path.write_text(stripped + '\n' + extra + '}\n')
          PY

          git diff --check
          git diff --stat

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/AIProviderSettingsView.swift mreaderTests/VisualOCRReliabilityTests.swift
          git commit -m "fix: make vision connection test prove image input"
          git rm .github/workflows/apply-vision-connection-probe.yml
          git commit -m "chore: remove temporary vision probe workflow"
          git push origin HEAD:codex/visual-ocr-reliability
