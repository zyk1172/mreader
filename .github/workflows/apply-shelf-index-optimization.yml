name: Apply shelf index optimization

on:
  push:
    branches:
      - codex/shelf-series-index-performance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shelf-series-index-performance
          fetch-depth: 0

      - name: Patch ContentView
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mreader/ContentView.swift')
          text = path.read_text()

          old_setup = '''            let displayComics = visibleComics
            let visibleSeriesIDs = Set(displayComics.compactMap(\\.seriesID))
            let seriesItems = shelfFilter == .all
                ? library.series
                : library.series.filter { visibleSeriesIDs.contains($0.id) }
            let sortedSeriesItems = sortedSeriesByTitle(seriesItems)
            let rootComics = sortedComicsByTitle(displayComics.filter { $0.seriesID == nil })
'''
          new_setup = '''            let displayComics = visibleComics
            let libraryIndex = ShelfLibraryIndex(sortedComics: sortedComicsByTitle(displayComics))
            let seriesItems = shelfFilter == .all
                ? library.series
                : library.series.filter { libraryIndex.visibleSeriesIDs.contains($0.id) }
            let sortedSeriesItems = sortedSeriesByTitle(seriesItems)
            let rootComics = libraryIndex.rootComics
'''

          if old_setup not in text:
              raise SystemExit('Expected libraryPage setup block not found')
          text = text.replace(old_setup, new_setup, 1)

          old_lookup = 'sortedComicsByTitle(displayComics.filter { $0.seriesID == series.id })'
          occurrences = text.count(old_lookup)
          if occurrences != 2:
              raise SystemExit(f'Expected exactly 2 per-series filter/sort lookups, found {occurrences}')
          text = text.replace(old_lookup, 'libraryIndex.comics(for: series.id)')

          path.write_text(text)
          PY

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/apply-shelf-index-optimization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/ContentView.swift .github/workflows/apply-shelf-index-optimization.yml
          git diff --cached --check
          git commit -m "perf: reuse indexed series comics in shelf rendering"
          git push origin HEAD:codex/shelf-series-index-performance
