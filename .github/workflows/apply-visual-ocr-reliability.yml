name: Apply visual OCR reliability patch

on:
  push:
    branches:
      - codex/visual-ocr-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/visual-ocr-reliability
          fetch-depth: 0
      - name: Patch visual OCR pipeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mreader/AITranslator.swift')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''nonisolated struct OCRVerificationRegion: Sendable {
              let blockID: UUID
              let sourceRect: CGRect
          }
          ''',
          '''nonisolated struct OCRVerificationRegion: Sendable {
              let blockID: UUID
              let sourceRect: CGRect
          }

          nonisolated struct VisionRegionTextCandidate: Equatable, Sendable {
              let text: String
              let confidence: Double
          }
          ''',
          'region candidate struct')

          replace_once(
          '''                let cropImage = UIImage(cgImage: crop, scale: 1, orientation: .up)
                          let localBlocks = try await recognizeVisionPage(
                              image: cropImage,
                              apiKey: apiKey,
                              baseURL: baseURL,
                              model: model,
                              isRightToLeft: isRightToLeft,
                              viewportAspect: max(cropImage.size.height / max(cropImage.size.width, 1), 1.25),
                              modelDescriptor: modelDescriptor ?? AIModelProtocolCatalog.descriptor(for: model)
                          )
                          let original = corrected[originalIndex]
                          guard let match = visualVerificationMatch(
                              for: original,
                              candidates: localBlocks,
                              sourceRect: region.sourceRect
                          ) else {
                              continue
                          }
                          let best = match.block
                          let correctedText = best.text.trimmingCharacters(in: .whitespacesAndNewlines)
                          guard !correctedText.isEmpty else { continue }
                          let correctedBox = match.pageBoundingBox
                          let correctedFontScale = visualVerificationMappedFontScale(
                              for: best,
                              sourceRect: region.sourceRect,
                              correctedBox: correctedBox
                          )
                          let bubbleGeometry = visualVerificationMappedBubbleGeometry(
                              for: best,
                              sourceRect: region.sourceRect,
                              correctedBox: correctedBox
                          )
                          corrected[originalIndex] = TextBlock(
                              id: original.id,
                              text: correctedText,
                              boundingBox: correctedBox,
                              translation: original.translation,
                              confidence: max(original.confidence, best.confidence),
                              ocrSource: "visual-review",
                              // A rejected/uncertain local candidate that passed a
                              // visual text+geometry match is explicitly recovered.
                              isFiltered: false,
                              filterReason: nil,
                              estimatedFontScale: correctedFontScale,
                              textColorHex: original.textColorHex,
                              bubbleBox: bubbleGeometry.bubbleBox,
                              layoutSafeRegion: original.layoutSafeRegion ?? bubbleGeometry.bubbleBox,
                              polygon: original.polygon,
                              bubblePolygon: bubbleGeometry.bubblePolygon,
                              translationLines: original.translationLines,
                              textOrientation: best.textOrientation,
                              layoutRole: original.layoutRole == .standalone || best.layoutRole == .standalone
                                  ? .standalone
                                  : .dialogue,
                              sourceLineCount: original.sourceLineCount
                          )
                          print("MReader OCR visual review corrected block=\\(region.blockID) confidence=\\(String(format: \"%.2f\", best.confidence))")
          ''',
          '''                let cropImage = UIImage(cgImage: crop, scale: 1, orientation: .up)
                          let review = try await recognizeVisionRegionText(
                              image: cropImage,
                              apiKey: apiKey,
                              baseURL: baseURL,
                              model: model,
                              modelDescriptor: modelDescriptor ?? AIModelProtocolCatalog.descriptor(for: model)
                          )
                          let original = corrected[originalIndex]
                          corrected[originalIndex] = visualReviewedBlock(original: original, review: review)
                          print("MReader OCR visual text review corrected block=\\(region.blockID) confidence=\\(String(format: \"%.2f\", review.confidence))")
          ''',
          'block visual review')

          replace_once(
          '''            systemPrompt = "你只做漫画图片中的文字识别、断句、翻译和精确坐标标注。只使用 coordinateSpace、items、id、sourceText、translation、translationLines、textBox、bubbleBox、textPolygon、bubblePolygon、confidence、classification 这一套 JSON 字段；不得描述画面，不得输出 JSON 之外的内容。"
          ''',
          '''            systemPrompt = "你只做漫画图片中的文字识别、断句、翻译和精确坐标标注。只使用 coordinateSpace、items、id、sourceText、translation、translationLines、textBox、bubbleBox、layoutSafeRegion、textPolygon、bubblePolygon、confidence、classification 这一套 JSON 字段；不得描述画面，不得输出 JSON 之外的内容。"
          ''',
          'translation system prompt')

          replace_once(
          '''            systemPrompt = "你只做漫画图片中文字识别、断句和精确坐标标注，不要翻译。只使用 coordinateSpace、items、id、sourceText、textBox、bubbleBox、textPolygon、bubblePolygon、confidence、classification 这一套 JSON 字段；不得描述画面，不得输出 JSON 之外的内容。"
          ''',
          '''            systemPrompt = "你只做漫画图片中文字识别、断句和精确坐标标注，不要翻译。只使用 coordinateSpace、items、id、sourceText、textBox、bubbleBox、layoutSafeRegion、textPolygon、bubblePolygon、confidence、classification 这一套 JSON 字段；不得描述画面，不得输出 JSON 之外的内容。"
          ''',
          'recognition system prompt')

          replace_once(
          '''        let defaultMode: VisionResponseFormatMode = usesTranslationSchema ? .jsonSchema : .jsonObject
          ''',
          '''        let defaultMode: VisionResponseFormatMode = .jsonSchema
          ''',
          'recognition schema default')

          replace_once(
          '''        case .jsonSchema:
                      guard usesTranslationSchema else {
                          return .jsonObject
                      }
                      guard let schema = try? JSONSerialization.data(
                          withJSONObject: offlineVisionTranslationSchema()
                      ) else {
                          return nil
                      }
                      return .jsonSchema(name: "manga_offline_translation", schema: schema)
          ''',
          '''        case .jsonSchema:
                      let schemaObject = usesTranslationSchema
                          ? offlineVisionTranslationSchema()
                          : visionRecognitionSchema()
                      guard let schema = try? JSONSerialization.data(withJSONObject: schemaObject) else {
                          return nil
                      }
                      return .jsonSchema(
                          name: usesTranslationSchema ? "manga_offline_translation" : "manga_vision_recognition",
                          schema: schema
                      )
          ''',
          'recognition response schema')

          marker = '''    private static func recognizeVisionImage(image: UIImage, sourceRect: CGRect, apiKey: String, baseURL: String, model: String, modelDescriptor: AIModelDescriptor, isRightToLeft: Bool, additionalInstructions: String, translationTarget: TranslationTargetLanguage?, translationPromptTemplate: String, strictTranslationGeometry: Bool) async throws -> [TextBlock] {
          '''
          addition = '''    private static func recognizeVisionRegionText(
              image: UIImage,
              apiKey: String,
              baseURL: String,
              model: String,
              modelDescriptor: AIModelDescriptor
          ) async throws -> VisionRegionTextCandidate {
              guard !apiKey.isEmpty else { throw VisionTranslationError.api("未配置 API Key") }
              guard !model.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                  throw VisionTranslationError.api("未配置模型")
              }
              let preparedImage = resizedImageForVision(image, maxDimension: 1536)
              guard let imageDataURL = encodedVisionImageDataURL(preparedImage) else {
                  throw VisionTranslationError.imageEncodingFailed
              }
              let systemPrompt = "你只做漫画局部图片的原文转录。不要翻译，不要返回坐标，不要描述人物或画面，不要输出思考过程。只返回 sourceText 和 confidence。"
              let prompt = """
              这是已经由本地 OCR 定位好的单个漫画文字区域裁剪。
              请只根据图片逐字抄录实际可见的原文，不要猜测裁剪外内容，不要翻译，不要补剧情。
              保留原有标点、数字、拉长音、小假名和大小写；竖排文字按自然阅读顺序合并成一个字符串。
              不需要返回任何坐标。
              只输出 JSON：{"sourceText":"图中原文","confidence":0.95}
              如果图片中确实没有可读文字，输出 {"sourceText":"","confidence":0.0}。
              """

              let data: Data
              do {
                  data = try await visionCompletionData(
                      apiKey: apiKey,
                      baseURL: baseURL,
                      model: model,
                      modelDescriptor: modelDescriptor,
                      systemPrompt: systemPrompt,
                      prompt: prompt,
                      imageDataURL: imageDataURL,
                      responseFormat: .jsonObject
                  )
              } catch {
                  guard isUnsupportedResponseFormat(error) else { throw error }
                  data = try await visionCompletionData(
                      apiKey: apiKey,
                      baseURL: baseURL,
                      model: model,
                      modelDescriptor: modelDescriptor,
                      systemPrompt: systemPrompt,
                      prompt: prompt,
                      imageDataURL: imageDataURL,
                      responseFormat: nil
                  )
              }

              guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                    let content = assistantContent(from: json) else {
                  throw VisionTranslationError.invalidJSON
              }
              if looksLikeVisionNoTextResponse(content) {
                  throw VisionTranslationError.modelDidNotReadImage
              }
              guard let candidate = parseVisionRegionTextCandidate(from: content) else {
                  throw VisionTranslationError.emptyResult
              }
              return candidate
          }

          private static func parseVisionRegionTextCandidate(from content: String) -> VisionRegionTextCandidate? {
              if let data = normalizedVisionJSONData(from: content),
                 let object = try? JSONSerialization.jsonObject(with: data, options: [.fragmentsAllowed]) {
                  let item: [String: Any]?
                  if let dictionary = object as? [String: Any] {
                      if firstString(
                          in: dictionary,
                          keys: ["sourceText", "source_text", "text", "original", "originalText"]
                      ).isEmpty,
                         let first = (dictionary["items"] as? [[String: Any]])?.first {
                          item = first
                      } else {
                          item = dictionary
                      }
                  } else if let array = object as? [[String: Any]] {
                      item = array.first
                  } else {
                      item = nil
                  }
                  if let item {
                      let text = firstString(
                          in: item,
                          keys: ["sourceText", "source_text", "text", "original", "originalText"]
                      ).trimmingCharacters(in: .whitespacesAndNewlines)
                      guard !text.isEmpty, !looksLikeVisionNoTextResponse(text) else { return nil }
                      let confidence = min(max(doubleValue(from: item["confidence"]) ?? 0.75, 0), 1)
                      return VisionRegionTextCandidate(text: text, confidence: confidence)
                  }
                  return nil
              }

              var plain = extractedJSONPayload(from: content)
                  .replacingOccurrences(
                      of: #"^```(?:text|markdown)?\\s*|\\s*```$"#,
                      with: "",
                      options: [.regularExpression, .caseInsensitive]
                  )
                  .trimmingCharacters(in: .whitespacesAndNewlines)
              if plain.hasPrefix("\"") && plain.hasSuffix("\"") && plain.count >= 2 {
                  plain.removeFirst()
                  plain.removeLast()
              }
              guard !plain.isEmpty, !looksLikeVisionNoTextResponse(plain) else { return nil }
              return VisionRegionTextCandidate(text: plain, confidence: 0.6)
          }

          static func parseVisionRegionTextCandidateForDiagnostics(
              from content: String
          ) -> VisionRegionTextCandidate? {
              parseVisionRegionTextCandidate(from: content)
          }

          private static func visualReviewedBlock(
              original: TextBlock,
              review: VisionRegionTextCandidate
          ) -> TextBlock {
              TextBlock(
                  id: original.id,
                  text: review.text.trimmingCharacters(in: .whitespacesAndNewlines),
                  boundingBox: original.boundingBox,
                  translation: original.translation,
                  confidence: max(original.confidence, review.confidence),
                  ocrSource: "visual-review-text",
                  isFiltered: false,
                  filterReason: nil,
                  estimatedFontScale: original.estimatedFontScale,
                  textColorHex: original.textColorHex,
                  bubbleBox: original.bubbleBox,
                  layoutSafeRegion: original.layoutSafeRegion,
                  polygon: original.polygon,
                  bubblePolygon: original.bubblePolygon,
                  translationLines: original.translationLines,
                  textOrientation: original.textOrientation,
                  layoutRole: original.layoutRole,
                  sourceLineCount: original.sourceLineCount
              )
          }

          static func visualReviewedBlockForDiagnostics(
              original: TextBlock,
              review: VisionRegionTextCandidate
          ) -> TextBlock {
              visualReviewedBlock(original: original, review: review)
          }

          private static func looksLikeVisionNoTextResponse(_ text: String) -> Bool {
              let normalized = text
                  .trimmingCharacters(in: .whitespacesAndNewlines)
                  .lowercased()
              guard normalized.count <= 200 else { return false }
              let refusalMarkers = [
                  "无法识别", "无法读取", "无法返回", "不能识别", "不能读取",
                  "未检测到文字", "没有检测到文字", "未发现文字", "没有可读文字",
                  "抱歉，我无法", "看不到图片", "无法查看图片",
                  "unable to read", "unable to identify", "cannot read", "can't read",
                  "cannot view", "can't view", "no readable text", "no text found"
              ]
              return refusalMarkers.contains { normalized.contains($0) }
          }

          ''' + marker
          replace_once(marker, addition, 'region text helper')

          replace_once(
          '''        guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                    let content = assistantContent(from: json) else {
                  throw VisionTranslationError.invalidJSON
              }
              let blocks: [TextBlock]
          ''',
          '''        guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                    let content = assistantContent(from: json) else {
                  throw VisionTranslationError.invalidJSON
              }
              if looksLikeVisionNoTextResponse(content) {
                  throw VisionTranslationError.modelDidNotReadImage
              }
              let blocks: [TextBlock]
          ''',
          'full page refusal detection')

          replace_once(
          '''        case protocolViolation(String)
              case emptyResult
          ''',
          '''        case protocolViolation(String)
              case modelDidNotReadImage
              case emptyResult
          ''',
          'vision error case')

          replace_once(
          '''            case .protocolViolation(let message):
                      return "视觉翻译协议错误：\\(message)"
                  case .emptyResult:
                      return "视觉翻译没有返回可用文本"
          ''',
          '''            case .protocolViolation(let message):
                      return "视觉翻译协议错误：\\(message)"
                  case .modelDidNotReadImage:
                      return "视觉模型没有从图片读取到文字，请确认当前模型支持图像输入"
                  case .emptyResult:
                      return "视觉翻译没有返回可用文本"
          ''',
          'vision error description')

          replace_once(
          '''        case .invalidJSON, .invalidCoordinates, .missingTextBox, .missingTranslation, .protocolViolation, .emptyResult:
                  return true
          ''',
          '''        case .invalidJSON, .invalidCoordinates, .missingTextBox, .missingTranslation,
               .protocolViolation, .modelDidNotReadImage, .emptyResult:
                  return true
          ''',
          'vision slice fallback')

          schema_marker = '''    private static func offlineVisionTranslationSchema() -> [String: Any] {
          '''
          schema_addition = '''    private static func visionRecognitionSchema() -> [String: Any] {
              let point: [String: Any] = [
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["x", "y"],
                  "properties": [
                      "x": ["type": "number", "minimum": 0, "maximum": 1],
                      "y": ["type": "number", "minimum": 0, "maximum": 1]
                  ]
              ]
              let rect: [String: Any] = [
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["x", "y", "width", "height"],
                  "properties": [
                      "x": ["type": "number", "minimum": 0, "maximum": 1],
                      "y": ["type": "number", "minimum": 0, "maximum": 1],
                      "width": ["type": "number", "exclusiveMinimum": 0, "maximum": 1],
                      "height": ["type": "number", "exclusiveMinimum": 0, "maximum": 1]
                  ]
              ]
              let item: [String: Any] = [
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["sourceText", "textBox", "confidence", "classification"],
                  "properties": [
                      "id": ["type": "string"],
                      "sourceText": ["type": "string"],
                      "textBox": rect,
                      "bubbleBox": rect,
                      "layoutSafeRegion": rect,
                      "textPolygon": ["type": "array", "minItems": 4, "items": point],
                      "bubblePolygon": ["type": "array", "minItems": 4, "items": point],
                      "confidence": ["type": "number", "minimum": 0, "maximum": 1],
                      "classification": [
                          "type": "string",
                          "enum": [
                              "dialogue", "narration", "soundEffect", "url", "advertisement",
                              "watermark", "copyright", "pageNumber"
                          ]
                      ]
                  ]
              ]
              return [
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["coordinateSpace", "items"],
                  "properties": [
                      "coordinateSpace": ["type": "string", "enum": ["normalized"]],
                      "items": ["type": "array", "items": item]
                  ]
              ]
          }

          ''' + schema_marker
          replace_once(schema_marker, schema_addition, 'recognition schema definition')

          path.write_text(text)

          test_path = Path('mreaderTests/TranslationComicIntegrationRegressionTests.swift')
          tests = test_path.read_text()
          insertion = '''
              func testVisionRegionTextParserAcceptsCoordinateFreeJSON() throws {
                  let result = try XCTUnwrap(
                      AITranslator.parseVisionRegionTextCandidateForDiagnostics(
                          from: #"{"sourceText":"ウィキペディアに","confidence":0.93}"#
                      )
                  )
                  XCTAssertEqual(result.text, "ウィキペディアに")
                  XCTAssertEqual(result.confidence, 0.93, accuracy: 0.0001)
              }

              func testVisionRegionTextParserAcceptsPlainTextFallback() throws {
                  let result = try XCTUnwrap(
                      AITranslator.parseVisionRegionTextCandidateForDiagnostics(from: "有名人です。")
                  )
                  XCTAssertEqual(result.text, "有名人です。")
                  XCTAssertEqual(result.confidence, 0.6, accuracy: 0.0001)
              }

              func testVisionRegionTextParserRejectsModelRefusal() {
                  XCTAssertNil(
                      AITranslator.parseVisionRegionTextCandidateForDiagnostics(
                          from: "抱歉，我无法读取这张图片中的文字。"
                      )
                  )
              }

              func testVisualTextReviewPreservesLocalOCRGeometry() {
                  let original = TextBlock(
                      text: "OEIIII",
                      boundingBox: CGRect(x: 0.30, y: 0.20, width: 0.08, height: 0.24),
                      confidence: 0.3,
                      ocrSource: "original:manual",
                      estimatedFontScale: 0.08,
                      bubbleBox: CGRect(x: 0.28, y: 0.18, width: 0.14, height: 0.30),
                      layoutSafeRegion: CGRect(x: 0.29, y: 0.19, width: 0.12, height: 0.28),
                      textOrientation: .vertical,
                      layoutRole: .dialogue
                  )
                  let reviewed = AITranslator.visualReviewedBlockForDiagnostics(
                      original: original,
                      review: VisionRegionTextCandidate(text: "ウィキペディアに", confidence: 0.91)
                  )

                  XCTAssertEqual(reviewed.text, "ウィキペディアに")
                  XCTAssertEqual(reviewed.boundingBox, original.boundingBox)
                  XCTAssertEqual(reviewed.bubbleBox, original.bubbleBox)
                  XCTAssertEqual(reviewed.layoutSafeRegion, original.layoutSafeRegion)
                  XCTAssertEqual(reviewed.textOrientation, original.textOrientation)
                  XCTAssertEqual(reviewed.layoutRole, original.layoutRole)
                  XCTAssertEqual(reviewed.ocrSource, "visual-review-text")
                  XCTAssertFalse(reviewed.isFiltered)
              }

              func testVisionRecognitionPromptAndSystemContractIncludeLayoutSafeRegion() {
                  let prompt = AITranslator.visionRecognitionPromptForDiagnostics(isRightToLeft: true)
                  XCTAssertTrue(prompt.contains("layoutSafeRegion"))
              }
          '''
          close = '\n}'
          if not tests.endswith(close):
              raise SystemExit('test file closing brace not found')
          tests = tests[:-len(close)] + insertion + close
          test_path.write_text(tests)
          PY

          git diff --check
          git diff --stat
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/AITranslator.swift mreaderTests/TranslationComicIntegrationRegressionTests.swift
          git commit -m "fix: make visual OCR review text-first"
          git push origin HEAD:codex/visual-ocr-reliability
