name: Codex font safety patch

on:
  push:
    branches:
      - codex/translation-style-guided-focus
    paths:
      - .github/workflows/codex-font-safety-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/translation-style-guided-focus
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/codex-font-safety-patch.py
      - name: Commit patch
        run: |
          rm .github/codex-font-safety-patch.py
          rm .github/workflows/codex-font-safety-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix pathological translation font sizing"
          git push origin HEAD:codex/translation-style-guided-focus
