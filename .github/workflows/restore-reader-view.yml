name: Restore ReaderView

on:
  push:
    branches:
      - feature/guided-panel-v1
    paths:
      - .github/workflows/restore-reader-view.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guided-panel-v1
          fetch-depth: 0
      - name: Restore ReaderView from last good head
        run: |
          git checkout 67f5168758d29dc294e69235a6cabba8d93fad77 -- mreader/ReaderView.swift
          rm .github/workflows/restore-reader-view.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+zyk1172@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore ReaderView after metadata update conflict"
          git push origin feature/guided-panel-v1
