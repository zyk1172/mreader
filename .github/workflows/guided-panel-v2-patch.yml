name: Guided Panel v2 patch

on:
  push:
    branches:
      - feat/guided-panel-vision-motion-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guided-panel-vision-motion-v2
          fetch-depth: 0

      - name: Apply Guided Panel v2 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count} for {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Preserve class-aware instance contours and ordering diagnostics in Guided Panel cache.
          path = "mreader/PanelDetectionService.swift"
          replace_once(path, '''nonisolated struct DetectedPanel: Sendable, Equatable {
              let rect: CGRect
              let confidence: Float
              let source: PanelDetectionSource

              init(rect: CGRect, confidence: Float, source: PanelDetectionSource) {
                  self.rect = rect
                  self.confidence = confidence
                  self.source = source
              }
          }

          nonisolated struct PanelLayoutPanel: Codable, Sendable, Equatable {
              let rect: NormalizedRect
              let confidence: Float
              let source: PanelDetectionSource
          }

          nonisolated struct PanelPageLayout: Codable, Sendable, Equatable {
              static let schemaVersion = 2
              static let modelVersion = 3

              let schemaVersion: Int
              let modelVersion: Int
              let detectorIdentifier: String
              let direction: String
              let sourceFingerprint: String
              let panels: [PanelLayoutPanel]
              let contentBounds: NormalizedRect
              let usedFallback: Bool

              var panelRects: [CGRect] { panels.map(\\.rect.cgRect) }
          }
          ''', '''nonisolated struct DetectedPanel: Sendable, Equatable {
              let rect: CGRect
              let confidence: Float
              let source: PanelDetectionSource
              let contour: [CGPoint]?

              init(
                  rect: CGRect,
                  confidence: Float,
                  source: PanelDetectionSource,
                  contour: [CGPoint]? = nil
              ) {
                  self.rect = rect
                  self.confidence = confidence
                  self.source = source
                  self.contour = contour
              }
          }

          nonisolated struct PanelLayoutPanel: Codable, Sendable, Equatable {
              let rect: NormalizedRect
              let confidence: Float
              let source: PanelDetectionSource
              let contour: MangaVisionContour?

              init(
                  rect: NormalizedRect,
                  confidence: Float,
                  source: PanelDetectionSource,
                  contour: MangaVisionContour? = nil
              ) {
                  self.rect = rect
                  self.confidence = confidence
                  self.source = source
                  self.contour = contour
              }
          }

          nonisolated struct PanelPageLayout: Codable, Sendable, Equatable {
              static let schemaVersion = 3
              static let modelVersion = 4

              let schemaVersion: Int
              let modelVersion: Int
              let detectorIdentifier: String
              let direction: String
              let sourceFingerprint: String
              let panels: [PanelLayoutPanel]
              let contentBounds: NormalizedRect
              let usedFallback: Bool
              let orderingStrategyRaw: String

              init(
                  schemaVersion: Int,
                  modelVersion: Int,
                  detectorIdentifier: String,
                  direction: String,
                  sourceFingerprint: String,
                  panels: [PanelLayoutPanel],
                  contentBounds: NormalizedRect,
                  usedFallback: Bool,
                  orderingStrategy: PanelReadingOrderStrategy = .strictXYCut
              ) {
                  self.schemaVersion = schemaVersion
                  self.modelVersion = modelVersion
                  self.detectorIdentifier = detectorIdentifier
                  self.direction = direction
                  self.sourceFingerprint = sourceFingerprint
                  self.panels = panels
                  self.contentBounds = contentBounds
                  self.usedFallback = usedFallback
                  self.orderingStrategyRaw = orderingStrategy.rawValue
              }

              var panelRects: [CGRect] { panels.map(\\.rect.cgRect) }
              var orderingStrategy: PanelReadingOrderStrategy {
                  PanelReadingOrderStrategy(rawValue: orderingStrategyRaw) ?? .strictXYCut
              }
          }
          ''')

          replace_once(path, '''            return DetectedPanel(
                          rect: rect,
                          confidence: panel.confidence,
                          source: panel.source
                      )
          ''', '''            return DetectedPanel(
                          rect: rect,
                          confidence: panel.confidence,
                          source: panel.source,
                          contour: panel.contour
                      )
          ''')

          replace_once(path, '''            if containment >= 0.90, sizeRatio <= 0.58 {
                          return candidateArea > existingArea
                      }
          ''', '''            if (candidate.source == .visionRectangle || existing.source == .visionRectangle),
                         containment >= 0.90,
                         sizeRatio <= 0.58 {
                          return candidateArea > existingArea
                      }
          ''')

          replace_once(path, '''        let unionArea = max(lhsArea + rhsArea - intersectionArea, 0.0001)
                  let iou = intersectionArea / unionArea
                  let containment = intersectionArea / max(min(lhsArea, rhsArea), 0.0001)
                  return iou >= 0.58 || containment >= 0.82
          ''', '''        let unionArea = max(lhsArea + rhsArea - intersectionArea, 0.0001)
                  let iou = intersectionArea / unionArea
                  let smallerArea = min(lhsArea, rhsArea)
                  let largerArea = max(lhsArea, rhsArea)
                  let containment = intersectionArea / max(smallerArea, 0.0001)
                  let sizeRatio = smallerArea / max(largerArea, 0.0001)
                  if lhs.source == .coreML, rhs.source == .coreML {
                      // The segmentation model already separates frame from balloon. Preserve
                      // real inset panels instead of treating containment alone as duplication.
                      return iou >= 0.62 || (containment >= 0.90 && sizeRatio >= 0.72)
                  }
                  return iou >= 0.58 || containment >= 0.82
          ''')

          replace_once(path, '''    static func isUsable(_ panels: [DetectedPanel]) -> Bool {
                  guard (2...12).contains(panels.count) else { return false }
          ''', '''    static func isUsable(_ panels: [DetectedPanel]) -> Bool {
                  let maximumPanelCount = panels.allSatisfy { $0.source == .coreML } ? 18 : 12
                  guard (2...maximumPanelCount).contains(panels.count) else { return false }
          ''')

          replace_once(path, '''        let primaryPanels = (mangaAnalysis?.panels ?? []).map {
                      DetectedPanel(
                          rect: $0.normalizedRect,
                          confidence: $0.confidence,
                          source: .coreML
                      )
                  }
          ''', '''        let primaryPanels = (mangaAnalysis?.panels ?? []).map {
                      DetectedPanel(
                          rect: $0.normalizedRect,
                          confidence: $0.confidence,
                          source: .coreML,
                          contour: $0.contour?.cgPoints
                      )
                  }
          ''')

          replace_once(path, '''        if PanelLayoutQuality.isUsable(processed) {
                      let ordered = PanelReadingOrder.ordered(processed, isRightToLeft: isRightToLeft)
                      result = PanelPageLayout(
                          schemaVersion: PanelPageLayout.schemaVersion,
                          modelVersion: PanelPageLayout.modelVersion,
                          detectorIdentifier: detectorIdentifier,
                          direction: direction,
                          sourceFingerprint: sourceFingerprint,
                          panels: ordered.map {
                              PanelLayoutPanel(
                                  rect: NormalizedRect($0.rect),
                                  confidence: $0.confidence,
                                  source: $0.source
                              )
                          },
                          contentBounds: NormalizedRect(contentBounds),
                          usedFallback: false
                      )
          ''', '''        if PanelLayoutQuality.isUsable(processed) {
                      let structure = MangaPageStructureGraph(
                          panels: processed,
                          analysis: mangaAnalysis,
                          isRightToLeft: isRightToLeft
                      )
                      let readingPlan = PanelReadingOrder.plan(
                          processed,
                          isRightToLeft: isRightToLeft,
                          structure: structure
                      )
                      result = PanelPageLayout(
                          schemaVersion: PanelPageLayout.schemaVersion,
                          modelVersion: PanelPageLayout.modelVersion,
                          detectorIdentifier: detectorIdentifier,
                          direction: direction,
                          sourceFingerprint: sourceFingerprint,
                          panels: readingPlan.panels.map {
                              PanelLayoutPanel(
                                  rect: NormalizedRect($0.rect),
                                  confidence: $0.confidence,
                                  source: $0.source,
                                  contour: $0.contour.map { MangaVisionContour(points: $0) }
                              )
                          },
                          contentBounds: NormalizedRect(contentBounds),
                          usedFallback: false,
                          orderingStrategy: readingPlan.strategy
                      )
          ''')

          replace_once(path, '''            contentBounds: NormalizedRect(fallback),
                      usedFallback: true
                  )
          ''', '''            contentBounds: NormalizedRect(fallback),
                      usedFallback: true,
                      orderingStrategy: .fullPageFallback
                  )
          ''')

          # Preserve nested model panels; mask/text/balloon post-processing remains class-specific.
          replace_once(
              "mreader/MangaVisionProvider.swift",
              "            panels: MangaVisionRegionPostProcessor.deduplicated(grouped[.panel] ?? []),\n",
              "            panels: grouped[.panel] ?? [],\n"
          )

          # Bump the shared analysis contract used by dependent OCR/translation cache identities.
          replace_once(
              "mreader/MangaVisionService.swift",
              '    static let analysisRevision = "manga-vision-page-v1"\n',
              '    static let analysisRevision = "manga-vision-page-v2-mask-structure"\n'
          )

          # Guided Panel camera: distance-aware, staged context bridge, dynamic viewport tuning.
          reader = Path("mreader/ReaderView.swift")
          text = reader.read_text()
          start = text.index("struct GuidedPanelReader: View {")
          end = text.index("\nstruct AnimatedPageReader: View {", start)
          guided = r'''struct GuidedPanelReader: View {
              @Environment(\.accessibilityReduceMotion) private var reduceMotion

              let pages: [ComicPage]
              @Binding var currentPageIndex: Int
              let readingDirection: ReadingDirection
              let comic: ComicBook
              let translateRequestID: UUID
              let ocrMagnifyRequestID: UUID
              let isOCRMagnificationVisible: Bool
              let targetLanguage: String
              let onTranslationStateChange: (Bool) -> Void
              let areControlsVisible: Bool
              let onShowControls: () -> Void
              let onHideControls: () -> Void

              @State private var layout: PanelPageLayout?
              @State private var sourceSize: CGSize = .zero
              @State private var panelIndex = 0
              @State private var isDetecting = false
              @State private var enterCurrentPageAtLastPanel = false
              @State private var panelNavigationDirection = 1
              @State private var cameraFocusOverride: CGRect?
              @State private var isPanelTransitioning = false
              @State private var panelMotionTask: Task<Void, Never>?

              private var pageTransition: AnyTransition {
                  guard !reduceMotion else { return .opacity }
                  let forward = panelNavigationDirection >= 0
                  let forwardInsertion: Edge = readingDirection == .rightToLeft ? .leading : .trailing
                  let forwardRemoval: Edge = readingDirection == .rightToLeft ? .trailing : .leading
                  return .asymmetric(
                      insertion: .move(edge: forward ? forwardInsertion : forwardRemoval).combined(with: .opacity),
                      removal: .move(edge: forward ? forwardRemoval : forwardInsertion).combined(with: .opacity)
                  )
              }

              private var currentPage: ComicPage? {
                  guard pages.indices.contains(currentPageIndex) else { return nil }
                  return pages[currentPageIndex]
              }

              var body: some View {
                  GeometryReader { proxy in
                      let camera = panelTransform(in: proxy.size)
                      ZStack {
                          if let page = currentPage {
                              LocalImageView(
                                  url: page.url,
                                  comic: comic,
                                  comicID: comic.id,
                                  pageIndex: page.index,
                                  isOCREnabled: comic.isOCREnabled,
                                  isAITranslationEnabled: comic.isAITranslationEnabled,
                                  isAutoTranslationEnabled: comic.isAutoTranslationEnabled,
                                  aiTranslationModeRaw: comic.aiTranslationModeRaw,
                                  translationSourceLanguageRaw: comic.translationSourceLanguageRaw,
                                  translateRequestID: translateRequestID,
                                  ocrMagnifyRequestID: ocrMagnifyRequestID,
                                  isOCRMagnificationVisible: isOCRMagnificationVisible,
                                  ocrTextScale: comic.ocrTextScale,
                                  ocrSafeAreaInset: comic.ocrSafeAreaInset,
                                  ocrMinimumTextHeight: comic.ocrMinimumTextHeight,
                                  isRightToLeftReading: readingDirection == .rightToLeft,
                                  targetLanguage: targetLanguage,
                                  imageFitMode: .fitScreen,
                                  isPageTapGestureEnabled: false,
                                  isLongPressTranslationEnabled: areControlsVisible,
                                  onTranslationStateChange: onTranslationStateChange,
                                  onPreviousPage: previousPanel,
                                  onNextPage: nextPanel,
                                  areControlsVisible: areControlsVisible,
                                  onShowControls: onShowControls,
                                  onHideControls: onHideControls
                              )
                              .id(page.url)
                              .scaleEffect(camera.scale)
                              .offset(camera.offset)
                              .transition(pageTransition)
                              .task(id: "\(page.url.absoluteString)|\(readingDirection.rawValue)") {
                                  await detectPanels(for: page)
                              }
                          }

                          if isDetecting {
                              ProgressView().tint(.white).allowsHitTesting(false)
                          }

                          if !areControlsVisible {
                              HStack(spacing: 0) {
                                  Color.clear
                                      .contentShape(Rectangle())
                                      .onTapGesture { previousPanel() }
                                  Color.clear.frame(width: proxy.size.width * 0.30).allowsHitTesting(false)
                                  Color.clear
                                      .contentShape(Rectangle())
                                      .onTapGesture { nextPanel() }
                              }
                          }
                      }
                      .clipped()
                  }
                  .onDisappear {
                      panelMotionTask?.cancel()
                      panelMotionTask = nil
                      isPanelTransitioning = false
                  }
              }

              private func detectPanels(for page: ComicPage) async {
                  let pageURL = page.url
                  isDetecting = true

                  guard let image = await ReaderImageCache.shared.loadImage(for: pageURL, maxPixelSize: 6144) else {
                      guard currentPage?.url == pageURL else { return }
                      layout = nil
                      sourceSize = .zero
                      cameraFocusOverride = nil
                      isDetecting = false
                      isPanelTransitioning = false
                      return
                  }

                  let detectedSourceSize = CGSize(
                      width: image.cgImage.map { CGFloat($0.width) } ?? image.size.width,
                      height: image.cgImage.map { CGFloat($0.height) } ?? image.size.height
                  )
                  let detectedLayout = await PanelDetectionService.shared.layout(
                      comicID: comic.id,
                      pageIndex: page.index,
                      pageURL: pageURL,
                      image: image,
                      isRightToLeft: readingDirection == .rightToLeft
                  )

                  // A cached layout can arrive while the previous page is still completing
                  // its short context/slide stage. Do not collapse both motions into one snap.
                  while isPanelTransitioning, !Task.isCancelled {
                      try? await Task.sleep(for: .milliseconds(40))
                  }
                  guard !Task.isCancelled, currentPage?.url == pageURL else { return }
                  let lastPanelIndex = max(detectedLayout.panels.count - 1, 0)
                  let targetPanelIndex = enterCurrentPageAtLastPanel
                      ? lastPanelIndex
                      : min(max(panelIndex, 0), lastPanelIndex)
                  let targetRect = detectedLayout.panelRects.indices.contains(targetPanelIndex)
                      ? detectedLayout.panelRects[targetPanelIndex]
                      : detectedLayout.contentBounds.cgRect
                  let profile = GuidedPanelMotionPlanner.profile(from: nil, to: targetRect)

                  withAnimation(cameraAnimation(for: profile)) {
                      sourceSize = detectedSourceSize
                      layout = detectedLayout
                      panelIndex = targetPanelIndex
                      cameraFocusOverride = nil
                  }
                  enterCurrentPageAtLastPanel = false
                  isDetecting = false
              }

              private func panelTransform(in viewport: CGSize) -> (scale: CGFloat, offset: CGSize) {
                  guard viewport.width > 0, viewport.height > 0,
                        sourceSize.width > 0, sourceSize.height > 0 else {
                      return (1, .zero)
                  }
                  let normalized: CGRect
                  if let cameraFocusOverride {
                      normalized = cameraFocusOverride
                  } else if let layout {
                      normalized = layout.panelRects.indices.contains(panelIndex)
                          ? layout.panelRects[panelIndex]
                          : layout.contentBounds.cgRect
                  } else {
                      return (1, .zero)
                  }
                  let tuning = GuidedPanelMotionPlanner.viewportTuning(for: normalized)
                  let transform = GuidedPanelViewport.transform(
                      normalizedPanel: normalized,
                      imageAspectRatio: sourceSize.width / sourceSize.height,
                      viewportSize: viewport,
                      contextPadding: tuning.contextPadding,
                      maximumScale: tuning.maximumScale
                  )
                  return (transform.scale, transform.offset)
              }

              private func previousPanel() {
                  guard !isDetecting, !isPanelTransitioning else { return }
                  panelNavigationDirection = -1
                  if panelIndex > 0 {
                      moveWithinPage(to: panelIndex - 1)
                  } else if currentPageIndex > 0 {
                      moveToPage(currentPageIndex - 1, enterAtLastPanel: true)
                  } else {
                      HapticManager.shared.play(.warning)
                  }
              }

              private func nextPanel() {
                  guard !isDetecting, !isPanelTransitioning else { return }
                  panelNavigationDirection = 1
                  let count = max(layout?.panels.count ?? 1, 1)
                  if panelIndex + 1 < count {
                      moveWithinPage(to: panelIndex + 1)
                  } else if currentPageIndex + 1 < pages.count {
                      moveToPage(currentPageIndex + 1, enterAtLastPanel: false)
                  } else {
                      HapticManager.shared.play(.warning)
                  }
              }

              private func moveWithinPage(to targetIndex: Int) {
                  guard let layout,
                        layout.panelRects.indices.contains(panelIndex),
                        layout.panelRects.indices.contains(targetIndex) else { return }
                  let sourceRect = layout.panelRects[panelIndex]
                  let destinationRect = layout.panelRects[targetIndex]
                  let profile = GuidedPanelMotionPlanner.profile(
                      from: sourceRect,
                      to: destinationRect
                  )
                  HapticManager.shared.play(.light)
                  panelMotionTask?.cancel()

                  guard !reduceMotion, profile.usesContextBridge else {
                      withAnimation(cameraAnimation(for: profile)) {
                          panelIndex = targetIndex
                          cameraFocusOverride = nil
                      }
                      return
                  }

                  isPanelTransitioning = true
                  let bridgeRect = GuidedPanelMotionPlanner.bridgeRect(
                      from: sourceRect,
                      to: destinationRect
                  )
                  withAnimation(.easeOut(duration: profile.bridgeDuration)) {
                      cameraFocusOverride = bridgeRect
                  }
                  panelMotionTask = Task { @MainActor in
                      try? await Task.sleep(for: .seconds(profile.bridgeDuration))
                      guard !Task.isCancelled else {
                          cameraFocusOverride = nil
                          isPanelTransitioning = false
                          return
                      }
                      withAnimation(cameraAnimation(for: profile, duration: profile.settleDuration)) {
                          panelIndex = targetIndex
                          cameraFocusOverride = nil
                      }
                      try? await Task.sleep(for: .seconds(profile.settleDuration))
                      guard !Task.isCancelled else { return }
                      isPanelTransitioning = false
                  }
              }

              private func moveToPage(_ pageIndex: Int, enterAtLastPanel: Bool) {
                  guard pages.indices.contains(pageIndex) else {
                      HapticManager.shared.play(.warning)
                      return
                  }

                  panelMotionTask?.cancel()
                  panelNavigationDirection = pageIndex >= currentPageIndex ? 1 : -1
                  enterCurrentPageAtLastPanel = enterAtLastPanel
                  isDetecting = true
                  HapticManager.shared.play(.light)

                  guard !reduceMotion else {
                      layout = nil
                      sourceSize = .zero
                      cameraFocusOverride = nil
                      panelIndex = 0
                      currentPageIndex = pageIndex
                      return
                  }

                  let profile = GuidedPanelMotionPlanner.profile(
                      from: layout?.panelRects[safe: panelIndex],
                      to: nil,
                      crossesPageBoundary: true
                  )
                  isPanelTransitioning = true
                  let pageContext = layout?.contentBounds.cgRect
                      ?? CGRect(x: 0, y: 0, width: 1, height: 1)
                  withAnimation(.easeOut(duration: profile.bridgeDuration)) {
                      cameraFocusOverride = pageContext
                  }

                  panelMotionTask = Task { @MainActor in
                      try? await Task.sleep(for: .seconds(profile.bridgeDuration))
                      guard !Task.isCancelled else {
                          cameraFocusOverride = nil
                          isPanelTransitioning = false
                          return
                      }
                      withAnimation(.easeInOut(duration: 0.30)) {
                          layout = nil
                          sourceSize = .zero
                          cameraFocusOverride = nil
                          panelIndex = 0
                          currentPageIndex = pageIndex
                      }
                      try? await Task.sleep(for: .milliseconds(300))
                      guard !Task.isCancelled else { return }
                      isPanelTransitioning = false
                  }
              }

              private func cameraAnimation(
                  for profile: GuidedPanelMotionProfile,
                  duration overrideDuration: TimeInterval? = nil
              ) -> Animation? {
                  guard !reduceMotion else { return nil }
                  let duration = overrideDuration ?? profile.duration
                  switch profile.kind {
                  case .sameRow:
                      return .timingCurve(0.20, 0.62, 0.34, 1.0, duration: duration)
                  case .nearby:
                      return .timingCurve(0.22, 0.58, 0.32, 1.0, duration: duration)
                  case .nextRow, .farJump:
                      return .timingCurve(0.22, 0.56, 0.30, 1.0, duration: duration)
                  case .pageBoundary:
                      return .easeInOut(duration: duration)
                  case .focusEntry:
                      return .timingCurve(0.20, 0.64, 0.32, 1.0, duration: duration)
                  }
              }
          }

          private extension Collection {
              subscript(safe index: Index) -> Element? {
                  indices.contains(index) ? self[index] : nil
              }
          }
          '''
          reader.write_text(text[:start] + guided + text[end:])

          # Per-comic Guided Panel direction must survive library rescans and metadata updates.
          store = "mreader/ComicLibraryStore.swift"
          replace_once(store, '''    private static func syncMetadataChanged(existing: ComicBook, incoming: ComicBook) -> Bool {
                  existing.readingDirectionRaw != incoming.readingDirectionRaw
                      || existing.readingModeRaw != incoming.readingModeRaw
          ''', '''    private static func syncMetadataChanged(existing: ComicBook, incoming: ComicBook) -> Bool {
                  existing.readingDirectionRaw != incoming.readingDirectionRaw
                      || existing.guidedPanelReadingDirectionRaw != incoming.guidedPanelReadingDirectionRaw
                      || existing.readingModeRaw != incoming.readingModeRaw
          ''')
          replace_once(store, '''            merged.readingDirectionRaw = existing.readingDirectionRaw
                      merged.readingModeRaw = existing.readingModeRaw
          ''', '''            merged.readingDirectionRaw = existing.readingDirectionRaw
                      merged.guidedPanelReadingDirectionRaw = existing.guidedPanelReadingDirectionRaw
                      merged.readingModeRaw = existing.readingModeRaw
          ''')
          replace_once(store, '''                comics[index].readingDirectionRaw = remote.readingDirectionRaw
                          comics[index].readingModeRaw = remote.readingModeRaw
          ''', '''                comics[index].readingDirectionRaw = remote.readingDirectionRaw
                          comics[index].guidedPanelReadingDirectionRaw = remote.guidedPanelReadingDirectionRaw
                          comics[index].readingModeRaw = remote.readingModeRaw
          ''')

          # Carry the per-comic panel direction through iCloud metadata without breaking v2 payloads.
          cloud = "mreader/ICloudMetadataSyncService.swift"
          replace_once(cloud, '''    let metadataUpdatedAt: Date
              let readingDirectionRaw: String
              let readingModeRaw: String
          ''', '''    let metadataUpdatedAt: Date
              let readingDirectionRaw: String
              let guidedPanelReadingDirectionRaw: String
              let readingModeRaw: String
          ''')
          replace_once(cloud, '''        metadataUpdatedAt: Date = .distantPast,
                  readingDirectionRaw: String = "leftToRight",
                  readingModeRaw: String = "horizontalPage",
          ''', '''        metadataUpdatedAt: Date = .distantPast,
                  readingDirectionRaw: String = "leftToRight",
                  guidedPanelReadingDirectionRaw: String? = nil,
                  readingModeRaw: String = "horizontalPage",
          ''')
          replace_once(cloud, '''        self.metadataUpdatedAt = metadataUpdatedAt
                  self.readingDirectionRaw = readingDirectionRaw
                  self.readingModeRaw = readingModeRaw
          ''', '''        self.metadataUpdatedAt = metadataUpdatedAt
                  self.readingDirectionRaw = readingDirectionRaw
                  self.guidedPanelReadingDirectionRaw = guidedPanelReadingDirectionRaw ?? readingDirectionRaw
                  self.readingModeRaw = readingModeRaw
          ''')
          replace_once(cloud, '''        readingDirectionRaw = try container.decodeIfPresent(String.self, forKey: .readingDirectionRaw) ?? "leftToRight"
                  readingModeRaw = try container.decodeIfPresent(String.self, forKey: .readingModeRaw) ?? "horizontalPage"
          ''', '''        readingDirectionRaw = try container.decodeIfPresent(String.self, forKey: .readingDirectionRaw) ?? "leftToRight"
                  guidedPanelReadingDirectionRaw = try container.decodeIfPresent(String.self, forKey: .guidedPanelReadingDirectionRaw)
                      ?? readingDirectionRaw
                  readingModeRaw = try container.decodeIfPresent(String.self, forKey: .readingModeRaw) ?? "horizontalPage"
          ''')
          replace_once(cloud, '''            readingDirectionRaw: readingDirectionRaw,
                      readingModeRaw: readingModeRaw,
                      pageTurnAnimationRaw: pageTurnAnimationRaw,
          ''', '''            readingDirectionRaw: readingDirectionRaw,
                      guidedPanelReadingDirectionRaw: guidedPanelReadingDirectionRaw,
                      readingModeRaw: readingModeRaw,
                      pageTurnAnimationRaw: pageTurnAnimationRaw,
          ''')
          replace_once(cloud, '''            readingDirectionRaw: usesLocalMetadata ? local.readingDirectionRaw : remote.readingDirectionRaw,
                      readingModeRaw: usesLocalMetadata ? local.readingModeRaw : remote.readingModeRaw,
          ''', '''            readingDirectionRaw: usesLocalMetadata ? local.readingDirectionRaw : remote.readingDirectionRaw,
                      guidedPanelReadingDirectionRaw: usesLocalMetadata
                          ? local.guidedPanelReadingDirectionRaw
                          : remote.guidedPanelReadingDirectionRaw,
                      readingModeRaw: usesLocalMetadata ? local.readingModeRaw : remote.readingModeRaw,
          ''')
          replace_once(cloud, '''                readingDirectionRaw: comic.readingDirectionRaw,
                          readingModeRaw: comic.readingModeRaw,
          ''', '''                readingDirectionRaw: comic.readingDirectionRaw,
                          guidedPanelReadingDirectionRaw: comic.guidedPanelReadingDirectionRaw,
                          readingModeRaw: comic.readingModeRaw,
          ''')

          # Remove this one-shot workflow from the production diff.
          workflow = Path(".github/workflows/guided-panel-v2-patch.yml")
          if workflow.exists():
              workflow.unlink()
          PY

          git diff --check
          git status --short

      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Manga Vision Guided Panel v2"
          git push origin HEAD:feat/guided-panel-vision-motion-v2
