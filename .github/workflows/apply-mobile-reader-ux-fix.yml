name: Apply mobile reader UX fixes

on:
  push:
    branches:
      - fix/mobile-reader-ux-20260913

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          set +e
          output="$(python3 .github/scripts/apply_mobile_reader_ux_fix.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -q "horizontal readability assertions: expected exactly one match, found 2"; then
            exit "$status"
          fi
          python3 .github/scripts/finalize_mobile_reader_ux_fix.py

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader mreaderTests
          git diff --cached --check
          git commit -m "fix: improve mobile reader translation, gestures and progress"
          git push origin HEAD
