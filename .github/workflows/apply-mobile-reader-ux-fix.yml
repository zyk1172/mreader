name: Apply mobile reader UX fixes

on:
  push:
    branches:
      - fix/mobile-reader-ux-20260913

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # ReaderView: remote progress freshness, in-place tiny translation, and smooth zoom-pan priority.
          path = 'mreader/ReaderView.swift'
          text = read(path)

          old = '''                    if comic.sourceType == .komga,
                       let remoteProgress = try? await KomgaProvider.remoteReadingProgressSnapshot(for: comic) {
                        let maxIndex = max(0, result.pages.count - 1)
                        comic.furthestPageIndex = min(
                            max(comic.furthestPageIndex, remoteProgress.pageIndex),
                            maxIndex
                        )
                        if remoteProgress.updatedAt > comic.progressUpdatedAt {
                            comic.currentPageIndex = min(remoteProgress.pageIndex, maxIndex)
                            comic.progressUpdatedAt = remoteProgress.updatedAt
                            comic.scrollProgress = 0
                            comic.scrollPageProgress = 0
                        }
                        onComicUpdate(comic)
                    }
'''
          new = '''                    if comic.sourceType == .komga,
                       let remoteProgress = try? await KomgaProvider.remoteReadingProgressSnapshot(for: comic),
                       remoteProgress.updatedAt > comic.progressUpdatedAt {
                        // Progress is a timestamped state, not a monotonic maximum. A newer
                        // explicit reset to page 0 must not be resurrected by an older local
                        // furthest-page value.
                        let remoteIndex = min(max(remoteProgress.pageIndex, 0), max(0, result.pages.count - 1))
                        comic.currentPageIndex = remoteIndex
                        comic.furthestPageIndex = remoteIndex
                        comic.progressUpdatedAt = remoteProgress.updatedAt
                        comic.scrollProgress = 0
                        comic.scrollPageProgress = 0
                        onComicUpdate(comic)
                    }
'''
          text = replace_once(text, old, new, 'ReaderContainer remote progress')

          text = replace_once(
              text,
              '''                    .gesture(zoomGesture)\n                    .gesture(gatedPanGesture)''',
              '''                    .gesture(zoomGesture)\n                    // Once zoomed, page panning must win over the parent page-turn drag.\n                    .highPriorityGesture(gatedPanGesture)''',
              'zoom pan gesture priority'
          )

          text = replace_once(
              text,
              '        DragGesture(minimumDistance: 6)\n            .onChanged { value in\n                guard ReaderGestureGate.isZoomed(scale: scale) else { return }',
              '        DragGesture(minimumDistance: 0)\n            .onChanged { value in\n                guard ReaderGestureGate.isZoomed(scale: scale) else { return }',
              'zoom pan minimum distance'
          )

          text = replace_once(
              text,
              '''            // detected bubble 沿用真实气泡范围；measuredText 只按译文测量结果排版。
            geometryStrategy: hasReliableBubble ? .detectedBubble : .measuredText,
            minimumReadableFontSize: CGFloat(comic?.minimumReadableTranslationFontSize ?? ComicBook.defaultMinimumReadableTranslationFontSize)
''',
              '''            // detected bubble 沿用真实气泡范围；measuredText 只按译文测量结果排版。
            geometryStrategy: hasReliableBubble ? .detectedBubble : .measuredText,
            // 手机阅读不再把小译文转换成可点击“放大/展开”卡片；空间不足时
            // 继续缩小字号并原位显示，避免译文覆盖层抢占阅读手势。
            minimumReadableFontSize: nil
''',
              'translation readable floor'
          )

          overflow_pattern = re.compile(
              r'''            let collisionRemains = occupiedRects\.contains \{ \$0\.intersects\(rect\) \}\n'''
              r'''            let escapedBubble = item\.surfaceStyle == \.detectedBubble\n'''
              r'''                && !movementBounds\.insetBy\(dx: -0\.5, dy: -0\.5\)\.contains\(rect\)\n'''
              r'''            let layoutStatus: OCRBubbleLayoutEngine\.TranslationLayoutStatus =\n'''
              r'''                item\.layoutStatus == \.needsExpansion \|\| collisionRemains \|\| escapedBubble\n'''
              r'''                    \? \.needsExpansion\n'''
              r'''                    : \.fitted\n\n'''
              r'''            let presentationRect: CGRect\n'''
              r'''            if layoutStatus == \.needsExpansion \{.*?'''
              r'''            \} else \{\n'''
              r'''                presentationRect = rect\n'''
              r'''            \}\n''',
              re.S
          )
          replacement = '''            // Translation overflow remains a passive in-page layer. `nonOverlappingRect`
            // still tries to avoid collisions, but unresolved collisions never create a
            // tappable expansion affordance that can steal page gestures.
            let layoutStatus: OCRBubbleLayoutEngine.TranslationLayoutStatus = .fitted
            let presentationRect = rect
'''
          text, count = overflow_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'translation overflow presentation: expected one match, found {count}')

          # Remove the now-obsolete minimum-readable-font control from reader settings.
          settings_pattern = re.compile(
              r'''\n                        Divider\(\)\n\n'''
              r'''                        HStack \{\n'''
              r'''                            Text\("ocr\.minimumReadableTranslationFontSize"\.localized\).*?'''
              r'''                        Text\("ocr\.minimumReadableTranslationFontSizeDescription"\.localized\)\n'''
              r'''                            \.font\(\.caption\)\n'''
              r'''                            \.foregroundStyle\(\.secondary\)\n''',
              re.S
          )
          text, count = settings_pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'minimum readable setting: expected one match, found {count}')

          write(path, text)

          # ContentView: centered daily summary and per-comic reset action.
          path = 'mreader/ContentView.swift'
          text = read(path)
          text = replace_once(
              text,
              '    @State private var hideKomgaRequest: ComicBook?\n',
              '    @State private var hideKomgaRequest: ComicBook?\n    @State private var resetProgressRequest: ComicBook?\n',
              'reset progress state'
          )

          text = replace_once(
              text,
              '''            .modifier(alertModifiers)
            .task(id: library.libraryLoadIssues) {
''',
              '''            .modifier(alertModifiers)
            .confirmationDialog(
                resetProgressRequest.map { "comic.resetProgressConfirm".localizedFormat($0.title) }
                    ?? "comic.resetProgress".localized,
                isPresented: Binding(
                    get: { resetProgressRequest != nil },
                    set: { if !$0 { resetProgressRequest = nil } }
                ),
                titleVisibility: .visible
            ) {
                Button("comic.resetProgress".localized, role: .destructive) {
                    if let comic = resetProgressRequest {
                        resetProgressRequest = nil
                        performResetReadingProgress(for: comic)
                    }
                }
                Button("nav.cancel".localized, role: .cancel) {
                    resetProgressRequest = nil
                }
            } message: {
                Text("comic.resetProgressDescription".localized)
            }
            .task(id: library.libraryLoadIssues) {
''',
              'reset confirmation dialog'
          )

          text = replace_once(
              text,
              '''        if !ComicReadingProgress.isFinished(comic) {
            Button {
                HapticManager.shared.play(.medium)
                library.markAsRead(id: comic.id)
            } label: {
                Label("comic.markAsRead".localized, systemImage: "checkmark.circle")
            }
        }

        Button {
            HapticManager.shared.play(.medium)
            library.rebuildThumbnail(for: comic.id)
''',
              '''        if !ComicReadingProgress.isFinished(comic) {
            Button {
                HapticManager.shared.play(.medium)
                library.markAsRead(id: comic.id)
            } label: {
                Label("comic.markAsRead".localized, systemImage: "checkmark.circle")
            }
        }

        Button(role: .destructive) {
            HapticManager.shared.play(.medium)
            resetProgressRequest = comic
        } label: {
            Label("comic.resetProgress".localized, systemImage: "arrow.counterclockwise")
        }
        .disabled(!comic.hasBeenOpened && comic.currentPageIndex == 0 && comic.furthestPageIndex == 0 && comic.scrollProgress == 0 && comic.scrollPageProgress == 0)

        Button {
            HapticManager.shared.play(.medium)
            library.rebuildThumbnail(for: comic.id)
''',
              'reset progress menu item'
          )

          text = replace_once(
              text,
              '''    private func performConfirmedDelete() {
''',
              '''    private func performResetReadingProgress(for comic: ComicBook) {
        var updated = comic
        let now = Date()
        updated.currentPageIndex = 0
        updated.furthestPageIndex = 0
        updated.scrollProgress = 0
        updated.scrollPageProgress = 0
        updated.progressUpdatedAt = now
        updated.hasBeenOpened = false
        updated.lastReadAt = .distantPast

        if uiTestingFixtureComic?.id == updated.id {
            uiTestingFixtureComic = updated
        } else {
            library.update(updated)
        }
        HapticManager.shared.play(.success)

        // Komga keeps its own progress. Update it too, but keep the local reset even
        // when the server is temporarily unreachable; the newer local timestamp makes
        // stale remote progress lose during subsequent merges.
        guard updated.sourceType == .komga else { return }
        Task {
            do {
                try await KomgaProvider.updateReadProgress(for: updated)
            } catch {
                HapticManager.shared.play(.error)
                importError = "comic.resetProgressFailed".localizedFormat(error.localizedDescription)
            }
        }
    }

    private func performConfirmedDelete() {
''',
              'reset progress implementation'
          )

          text = replace_once(
              text,
              '''        VStack(alignment: .leading, spacing: 3) {
            Text(value)
                .font(.system(size: 34, weight: .bold, design: .rounded))
                .foregroundStyle(color)
                .monospacedDigit()
            Text(title)
                .font(.caption.weight(.semibold))
                .foregroundStyle(FitnessPalette.secondaryText)
        }
        .frame(maxWidth: .infinity, alignment: .leading)
''',
              '''        VStack(alignment: .center, spacing: 3) {
            Text(value)
                .font(.system(size: 34, weight: .bold, design: .rounded))
                .foregroundStyle(color)
                .monospacedDigit()
            Text(title)
                .font(.caption.weight(.semibold))
                .foregroundStyle(FitnessPalette.secondaryText)
                .multilineTextAlignment(.center)
        }
        .frame(maxWidth: .infinity, alignment: .center)
''',
              'today metrics centering'
          )
          write(path, text)

          # ComicBook: progress freshness must permit intentional reset instead of monotonic furthest-page resurrection.
          path = 'mreader/ComicBook.swift'
          text = read(path)
          old = '''        let pageLimit = max(0, totalPages - 1)
        let usesIncoming = incoming.progressUpdatedAt > existing.progressUpdatedAt
        let selectedPage = usesIncoming ? incoming.currentPageIndex : existing.currentPageIndex
        return Resolution(
            currentPageIndex: min(max(selectedPage, 0), pageLimit),
            furthestPageIndex: min(
                max(
                    max(existing.furthestPageIndex, incoming.furthestPageIndex),
                    max(existing.currentPageIndex, incoming.currentPageIndex)
                ),
                pageLimit
            ),
            progressUpdatedAt: max(existing.progressUpdatedAt, incoming.progressUpdatedAt),
            usesIncomingLocation: usesIncoming
        )
'''
          new = '''        let pageLimit = max(0, totalPages - 1)
        let usesIncoming = incoming.progressUpdatedAt > existing.progressUpdatedAt
        let selectedPage = usesIncoming ? incoming.currentPageIndex : existing.currentPageIndex
        let selectedFurthest = usesIncoming ? incoming.furthestPageIndex : existing.furthestPageIndex
        return Resolution(
            currentPageIndex: min(max(selectedPage, 0), pageLimit),
            // The newer progress snapshot owns both location fields. Taking a monotonic
            // max here makes an explicit reset impossible to synchronize across devices.
            furthestPageIndex: min(max(selectedFurthest, selectedPage, 0), pageLimit),
            progressUpdatedAt: max(existing.progressUpdatedAt, incoming.progressUpdatedAt),
            usesIncomingLocation: usesIncoming
        )
'''
          text = replace_once(text, old, new, 'progress merge policy')
          write(path, text)

          # Regression tests: reset freshness and no-expansion tiny translation path.
          path = 'mreaderTests/ReaderStateMutationTests.swift'
          text = read(path)
          addition = r'''

final class ReadingProgressResetRegressionTests: XCTestCase {
    func testNewerResetCanReduceCurrentAndFurthestProgressToZero() {
        let older = Date(timeIntervalSince1970: 10)
        let newer = Date(timeIntervalSince1970: 20)
        let existing = ComicBook(
            title: "Existing",
            bookmarkData: Data(),
            totalPages: 100,
            currentPageIndex: 42,
            furthestPageIndex: 70,
            progressUpdatedAt: older,
            hasBeenOpened: true
        )
        let incoming = ComicBook(
            id: existing.id,
            title: existing.title,
            bookmarkData: existing.bookmarkData,
            totalPages: 100,
            currentPageIndex: 0,
            furthestPageIndex: 0,
            progressUpdatedAt: newer,
            hasBeenOpened: false
        )

        let resolved = ReadingProgressMergePolicy.resolve(existing: existing, incoming: incoming, totalPages: 100)
        XCTAssertTrue(resolved.usesIncomingLocation)
        XCTAssertEqual(resolved.currentPageIndex, 0)
        XCTAssertEqual(resolved.furthestPageIndex, 0)
        XCTAssertEqual(resolved.progressUpdatedAt, newer)
    }

    func testOlderRemoteProgressCannotResurrectNewerReset() {
        let resetAt = Date(timeIntervalSince1970: 30)
        let staleAt = Date(timeIntervalSince1970: 20)
        let reset = ComicBook(
            title: "Reset",
            bookmarkData: Data(),
            totalPages: 80,
            currentPageIndex: 0,
            furthestPageIndex: 0,
            progressUpdatedAt: resetAt,
            hasBeenOpened: false
        )
        let stale = ComicBook(
            id: reset.id,
            title: reset.title,
            bookmarkData: reset.bookmarkData,
            totalPages: 80,
            currentPageIndex: 35,
            furthestPageIndex: 60,
            progressUpdatedAt: staleAt,
            hasBeenOpened: true
        )

        let resolved = ReadingProgressMergePolicy.resolve(existing: reset, incoming: stale, totalPages: 80)
        XCTAssertFalse(resolved.usesIncomingLocation)
        XCTAssertEqual(resolved.currentPageIndex, 0)
        XCTAssertEqual(resolved.furthestPageIndex, 0)
        XCTAssertEqual(resolved.progressUpdatedAt, resetAt)
    }
}
'''
          if 'final class ReadingProgressResetRegressionTests' not in text:
              text += addition
          write(path, text)

          path = 'mreaderTests/TranslationReadabilityRegressionTests.swift'
          text = read(path)
          marker = '\n}\n'
          method = r'''

    func testTinyBubbleCanStayInPlaceBelowLegacyReadableFloor() {
        let choice = OCRBubbleLayoutEngine.preferredTranslationLayout(
            translation: "这是一段需要在极小气泡中直接显示的长译文。",
            translationLines: [],
            sourceFontSize: 18,
            sourceRect: CGRect(x: 2, y: 2, width: 16, height: 16),
            allowedBounds: CGRect(x: 0, y: 0, width: 28, height: 28),
            lineSpacing: 2,
            textOrientation: .horizontal,
            geometryStrategy: .detectedBubble,
            minimumReadableFontSize: nil
        )
        XCTAssertEqual(choice.layout.status, .fitted)
        XCTAssertLessThan(choice.layout.fontSize, ComicBook.defaultMinimumReadableTranslationFontSize)
    }
'''
          if 'testTinyBubbleCanStayInPlaceBelowLegacyReadableFloor' not in text:
              pos = text.rfind(marker)
              if pos < 0:
                  raise SystemExit('translation readability test closing brace not found')
              text = text[:pos] + method + text[pos:]
          write(path, text)

          # Localizations for the new destructive action.
          translations = {
              'en.lproj': (
                  'Reset Reading Progress',
                  'Reset reading progress for “%@”?',
                  'This clears the current reading position and completion progress only. Reading history and statistics are kept.',
                  'Failed to sync reset reading progress: %@'
              ),
              'zh-Hans.lproj': (
                  '重置阅读进度',
                  '将《%@》的阅读进度归零？',
                  '只会清除当前阅读位置和完成进度，历史阅读记录与统计不会删除。',
                  '阅读进度已在本机归零，但同步到远端失败：%@'
              ),
              'ja.lproj': (
                  '読書進捗をリセット',
                  '「%@」の読書進捗をリセットしますか？',
                  '現在の読書位置と完了進捗のみをリセットします。読書履歴と統計は保持されます。',
                  '読書進捗のリセットを同期できませんでした：%@'
              ),
              'ko.lproj': (
                  '읽기 진행률 재설정',
                  '“%@”의 읽기 진행률을 재설정할까요?',
                  '현재 읽기 위치와 완료 진행률만 초기화합니다. 읽기 기록과 통계는 유지됩니다.',
                  '읽기 진행률 재설정을 동기화하지 못했습니다: %@'
              ),
          }
          for locale, values in translations.items():
              loc_path = Path('mreader') / locale / 'Localizable.strings'
              loc = loc_path.read_text(encoding='utf-8')
              if '"comic.resetProgress"' in loc:
                  continue
              title, confirm, description, failed = values
              loc += f'\n"comic.resetProgress" = "{title}";\n'
              loc += f'"comic.resetProgressConfirm" = "{confirm}";\n'
              loc += f'"comic.resetProgressDescription" = "{description}";\n'
              loc += f'"comic.resetProgressFailed" = "{failed}";\n'
              loc_path.write_text(loc, encoding='utf-8')

          # Final assertions guard against silently committing a partial patch.
          reader = read('mreader/ReaderView.swift')
          content = read('mreader/ContentView.swift')
          comic = read('mreader/ComicBook.swift')
          assert '.highPriorityGesture(gatedPanGesture)' in reader
          assert 'DragGesture(minimumDistance: 0)' in reader
          assert 'minimumReadableFontSize: nil' in reader
          assert 'item.layoutStatus == .needsExpansion || collisionRemains || escapedBubble' not in reader
          assert 'ocr.minimumReadableTranslationFontSize".localized' not in reader
          assert 'resetProgressRequest = comic' in content
          assert 'VStack(alignment: .center, spacing: 3)' in content
          assert 'let selectedFurthest = usesIncoming ? incoming.furthestPageIndex : existing.furthestPageIndex' in comic
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader mreaderTests
          git diff --cached --check
          git commit -m "fix: improve mobile reader translation, gestures and progress"
          git push origin HEAD
