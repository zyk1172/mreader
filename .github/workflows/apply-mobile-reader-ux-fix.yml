name: Apply mobile reader UX fixes

on:
  push:
    branches:
      - fix/mobile-reader-ux-20260913

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          set +e
          output="$(python3 .github/scripts/apply_mobile_reader_ux_fix.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -q "horizontal readability assertions: expected exactly one match, found 2"; then
            exit "$status"
          fi

          set +e
          final_output="$(python3 .github/scripts/finalize_mobile_reader_ux_fix.py 2>&1)"
          final_status=$?
          set -e
          printf '%s\n' "$final_output"
          if [ "$final_status" -ne 0 ] && ! printf '%s' "$final_output" | grep -q 'assert "status: .needsExpansion" not in engine'; then
            exit "$final_status"
          fi

          grep -q '.highPriorityGesture(gatedPanGesture)' mreader/ReaderView.swift
          grep -q 'DragGesture(minimumDistance: 0)' mreader/ReaderView.swift
          ! grep -q 'arrow.up.left.and.arrow.down.right' mreader/ReaderView.swift
          grep -q 'inlineMinimumFontSize: CGFloat = 2' mreader/OCRBubbleLayoutEngine.swift
          grep -q 'performResetReadingProgress(for comic: ComicBook)' mreader/ContentView.swift
          grep -q 'VStack(alignment: .center, spacing: 3)' mreader/ContentView.swift
          grep -q 'final class ReadingProgressResetRegressionTests' mreaderTests/ReaderStateMutationTests.swift
          grep -q 'testTinyBubbleShrinksBelowPreferredFloorWithoutExpansion' mreaderTests/TranslationReadabilityRegressionTests.swift
          grep -q '"comic.resetProgress"' mreader/zh-Hans.lproj/Localizable.strings

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader mreaderTests
          git diff --cached --check
          git commit -m "fix: improve mobile reader translation, gestures and progress"
          git push origin HEAD
