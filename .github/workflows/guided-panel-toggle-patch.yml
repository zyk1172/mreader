name: Guided Panel Toggle Patch

on:
  push:
    branches:
      - feature/guided-panel-v1

permissions:
  contents: write

jobs:
  patch-guided-panel-toggle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/guided-panel-v1
          fetch-depth: 0

      - name: Apply toggle fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mreader/ReaderView.swift')
          text = path.read_text()

          state_anchor = '''    @State private var showBookmarkNoteAlert = false\n\n    private var readingMode: ReadingMode {\n'''
          state_replacement = '''    @State private var showBookmarkNoteAlert = false\n    @State private var readingModeBeforeGuidedPanelRaw: String\n\n    private var readingMode: ReadingMode {\n'''
          if state_anchor not in text:
              raise SystemExit('ReaderView state anchor not found')
          text = text.replace(state_anchor, state_replacement, 1)

          init_anchor = '''        _activityLastPageIndex = State(initialValue: min(max(initialComic.currentPageIndex, 0), maxIndex))\n    }\n'''
          init_replacement = '''        _activityLastPageIndex = State(initialValue: min(max(initialComic.currentPageIndex, 0), maxIndex))\n        _readingModeBeforeGuidedPanelRaw = State(\n            initialValue: initialComic.readingModeRaw == ReadingMode.guidedPanel.rawValue\n                ? ReadingMode.horizontalPage.rawValue\n                : initialComic.readingModeRaw\n        )\n    }\n'''
          if init_anchor not in text:
              raise SystemExit('ReaderView init anchor not found')
          text = text.replace(init_anchor, init_replacement, 1)

          button_anchor = '''                Button {\n                    guard readingMode != .guidedPanel else { return }\n                    HapticManager.shared.play(.light)\n                    readingModeRaw.wrappedValue = ReadingMode.guidedPanel.rawValue\n                } label: {\n'''
          button_replacement = '''                Button {\n                    HapticManager.shared.play(.light)\n                    if readingMode == .guidedPanel {\n                        let restoreMode = ReadingMode(rawValue: readingModeBeforeGuidedPanelRaw)\n                            .flatMap { $0 == .guidedPanel ? nil : $0 }\n                            ?? .horizontalPage\n                        readingModeRaw.wrappedValue = restoreMode.rawValue\n                    } else {\n                        readingModeBeforeGuidedPanelRaw = comic.readingModeRaw\n                        readingModeRaw.wrappedValue = ReadingMode.guidedPanel.rawValue\n                    }\n                } label: {\n'''
          if button_anchor not in text:
              raise SystemExit('Guided Panel button anchor not found')
          text = text.replace(button_anchor, button_replacement, 1)

          path.write_text(text)
          PY

      - name: Commit toggle fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/guided-panel-toggle-patch.yml
          git add mreader/ReaderView.swift
          git commit -m "fix: make Guided Panel action toggleable"
          git push origin HEAD:feature/guided-panel-v1
