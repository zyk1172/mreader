name: Apply translation expansion patch

on:
  push:
    branches:
      - codex/translation-expansion-overlay-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_translation_expansion.py
      - name: Verify patch
        run: |
          git diff --check
          git diff -- mreader/ReaderView.swift mreader/TranslationComicIntegration.swift mreaderTests/TranslationComicIntegrationRegressionTests.swift
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/ReaderView.swift mreader/TranslationComicIntegration.swift mreaderTests/TranslationComicIntegrationRegressionTests.swift
          git commit -m "fix: keep overflow translations compact and readable"
          git push origin HEAD:codex/translation-expansion-overlay-fix
