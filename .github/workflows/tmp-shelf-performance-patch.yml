name: Temporary shelf performance patch

on:
  push:
    branches:
      - codex/shelf-series-performance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply shelf indexing refactor
        shell: python
        run: |
          from pathlib import Path

          path = Path("mreader/ContentView.swift")
          text = path.read_text()

          old_setup = '''            let displayComics = visibleComics
            let visibleSeriesIDs = Set(displayComics.compactMap(\\.seriesID))
            let seriesItems = shelfFilter == .all
                ? library.series
                : library.series.filter { visibleSeriesIDs.contains($0.id) }
            let sortedSeriesItems = sortedSeriesByTitle(seriesItems)
            let rootComics = sortedComicsByTitle(displayComics.filter { $0.seriesID == nil })
'''
          new_setup = '''            let displayComics = visibleComics
            let sortedDisplayComics = sortedComicsByTitle(displayComics)
            let sectionIndex = ShelfSectionIndex(sortedItems: sortedDisplayComics, seriesID: \\.seriesID)
            let visibleSeriesIDs = sectionIndex.seriesIDs
            let seriesItems = shelfFilter == .all
                ? library.series
                : library.series.filter { visibleSeriesIDs.contains($0.id) }
            let sortedSeriesItems = sortedSeriesByTitle(seriesItems)
            let rootComics = sectionIndex.rootItems
'''

          old_grid = '                                seriesGridItem(series, comics: sortedComicsByTitle(displayComics.filter { $0.seriesID == series.id }), cardWidth: cardWidth)'
          new_grid = '                                seriesGridItem(series, comics: sectionIndex.items(for: series.id), cardWidth: cardWidth)'
          old_list = '                                seriesListItem(series, comics: sortedComicsByTitle(displayComics.filter { $0.seriesID == series.id }))'
          new_list = '                                seriesListItem(series, comics: sectionIndex.items(for: series.id))'

          for old, new, label in [
              (old_setup, new_setup, "library setup"),
              (old_grid, new_grid, "grid series lookup"),
              (old_list, new_list, "list series lookup"),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} match, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)

          Path("mreader/ShelfSectionIndex.swift").write_text('''import Foundation

/// Pre-indexes an already sorted shelf in one pass so each series can retrieve
/// its comics without rescanning the complete visible comic array.
nonisolated struct ShelfSectionIndex<Item> {
    let rootItems: [Item]
    let itemsBySeriesID: [UUID: [Item]]
    let seriesIDs: Set<UUID>

    init(sortedItems: [Item], seriesID: (Item) -> UUID?) {
        var rootItems: [Item] = []
        var itemsBySeriesID: [UUID: [Item]] = [:]
        rootItems.reserveCapacity(sortedItems.count)

        for item in sortedItems {
            if let id = seriesID(item) {
                itemsBySeriesID[id, default: []].append(item)
            } else {
                rootItems.append(item)
            }
        }

        self.rootItems = rootItems
        self.itemsBySeriesID = itemsBySeriesID
        self.seriesIDs = Set(itemsBySeriesID.keys)
    }

    func items(for seriesID: UUID) -> [Item] {
        itemsBySeriesID[seriesID] ?? []
    }
}
''')

          Path("mreaderTests/ShelfSectionIndexTests.swift").write_text('''import Foundation
import Testing
@testable import mreader

struct ShelfSectionIndexTests {
    private struct Fixture: Equatable {
        let value: Int
        let seriesID: UUID?
    }

    @Test func groupsSortedItemsInOnePassAndPreservesOrder() {
        let firstSeries = UUID()
        let secondSeries = UUID()
        let fixtures = [
            Fixture(value: 1, seriesID: firstSeries),
            Fixture(value: 2, seriesID: nil),
            Fixture(value: 3, seriesID: firstSeries),
            Fixture(value: 4, seriesID: secondSeries),
            Fixture(value: 5, seriesID: nil),
        ]

        let index = ShelfSectionIndex(sortedItems: fixtures, seriesID: \\.seriesID)

        #expect(index.rootItems.map(\\.value) == [2, 5])
        #expect(index.items(for: firstSeries).map(\\.value) == [1, 3])
        #expect(index.items(for: secondSeries).map(\\.value) == [4])
        #expect(index.seriesIDs == Set([firstSeries, secondSeries]))
        #expect(index.items(for: UUID()).isEmpty)
    }
}
''')

          Path(".github/workflows/tmp-shelf-performance-patch.yml").unlink()

      - name: Check diff
        run: git diff --check

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/ContentView.swift mreader/ShelfSectionIndex.swift mreaderTests/ShelfSectionIndexTests.swift .github/workflows/tmp-shelf-performance-patch.yml
          git commit -m "perf: index shelf comics by series"
          git push origin HEAD:codex/shelf-series-performance
