name: Phase 4 model patch

on:
  push:
    branches:
      - codex/translation-comic-integration
    paths:
      - .github/workflows/phase4-model-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: codex/translation-comic-integration
          fetch-depth: 0

      - name: Apply Phase 4 patch
        run: python3 .github/phase4_model_patch.py

      - name: Commit source changes and remove patch helpers
        shell: bash
        run: |
          rm -f .github/phase4_model_patch.py .github/workflows/phase4-model-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add comic-aware translation regions and slicing'
          git push origin HEAD:codex/translation-comic-integration
