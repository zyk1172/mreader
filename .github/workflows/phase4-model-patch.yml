name: Phase 4 model patch

on:
  push:
    branches:
      - codex/translation-comic-integration
    paths:
      - .github/workflows/phase4-model-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/translation-comic-integration
          fetch-depth: 0
      - name: Apply F10 and F12 model changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('mreader/AITranslator.swift')
          text = path.read_text()

          # F10: keep physical bubble and layout-safe region as separate stored semantics.
          text = text.replace(
              '    var bubbleBox: CGRect?\n    /// textPolygon；保留旧属性名以兼容既有 OCR 调用。',
              '    /// Physical bubble bounds when a real bubble was detected. This is not a layout expansion hint.\n    var bubbleBox: CGRect?\n    /// Independent region in which translated text may be laid out. It may exist even when no physical bubble exists.\n    var layoutSafeRegion: CGRect?\n    /// textPolygon；保留旧属性名以兼容既有 OCR 调用。',
              1,
          )
          text = text.replace(
              'textColorHex: String? = nil, bubbleBox: CGRect? = nil, polygon: [CGPoint] = []',
              'textColorHex: String? = nil, bubbleBox: CGRect? = nil, layoutSafeRegion: CGRect? = nil, polygon: [CGPoint] = []',
              1,
          )
          text = text.replace(
              '        self.bubbleBox = bubbleBox\n        self.polygon = polygon',
              '        self.bubbleBox = bubbleBox\n        self.layoutSafeRegion = layoutSafeRegion\n        self.polygon = polygon',
              1,
          )

          # Vision protocol: bubbleBox is physical and optional; layoutSafeRegion is independent and required in strict translation mode.
          replacements = {
              '并给出文字框和推荐显示气泡框坐标。': '并给出文字框、真实物理气泡（存在时）和独立的安全排版区域。',
              'textBox、bubbleBox、textPolygon、bubblePolygon、confidence、classification': 'textBox、bubbleBox、layoutSafeRegion、textPolygon、bubblePolygon、confidence、classification',
              'textBox 必须紧贴原文字，bubbleBox 只表示译文允许扩展到的最大范围，不能代替 textBox。': 'textBox 必须紧贴原文字；bubbleBox 只表示真实物理气泡，没有气泡（例如无框拟声词）时必须省略；layoutSafeRegion 表示译文允许排版的安全区域，不能把它伪装成气泡。',
              '"bubbleBox": {"x": 0.1, "y": 0.18, "width": 0.34, "height": 0.1},': '"bubbleBox": {"x": 0.1, "y": 0.18, "width": 0.34, "height": 0.1},\n          "layoutSafeRegion": {"x": 0.11, "y": 0.19, "width": 0.32, "height": 0.08},',
              'textBox 紧贴文字，bubbleBox 覆盖文字所在的完整原气泡；同时尽量返回对应的四点 textPolygon 和 bubblePolygon。': 'textBox 紧贴文字；bubbleBox 只在能确认真实物理气泡时返回，无框拟声词必须省略；layoutSafeRegion 始终返回可安全摆放译文的区域；同时尽量返回对应的四点 textPolygon 和 bubblePolygon。',
              '"bubbleBox":{"x":0.08,"y":0.18,"width":0.24,"height":0.12},"textPolygon"': '"bubbleBox":{"x":0.08,"y":0.18,"width":0.24,"height":0.12},"layoutSafeRegion":{"x":0.09,"y":0.19,"width":0.22,"height":0.10},"textPolygon"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing AI prompt anchor: {old[:60]}')
              text = text.replace(old, new, 1)

          # Structured-output schema.
          old_required = '"sourceText", "translation", "textBox", "bubbleBox", "confidence", "classification"'
          if old_required not in text:
              raise SystemExit('schema required anchor missing')
          text = text.replace(
              old_required,
              '"sourceText", "translation", "textBox", "layoutSafeRegion", "confidence", "classification"',
              1,
          )
          schema_anchor = '                "bubbleBox": rect,\n                "textPolygon":'
          if schema_anchor not in text:
              raise SystemExit('schema properties anchor missing')
          text = text.replace(
              schema_anchor,
              '                "bubbleBox": rect,\n                "layoutSafeRegion": rect,\n                "textPolygon":',
              1,
          )

          # Strict parser no longer requires a fabricated bubble; it requires a layout-safe region instead.
          strict_old = '''                guard rectValue(from: item["bubbleBox"]) != nil else {
                    throw VisionTranslationError.protocolViolation("缺少必需 bubbleBox")
                }'''
          strict_new = '''                guard rectValue(from: item["layoutSafeRegion"] ?? item["layout_safe_region"]) != nil else {
                    throw VisionTranslationError.protocolViolation("缺少必需 layoutSafeRegion")
                }'''
          if strict_old not in text:
              raise SystemExit('strict bubble guard missing')
          text = text.replace(strict_old, strict_new, 1)

          # Translation parse model.
          text = text.replace(
              '            let bubbleRect: CGRect?\n            let rect: CGRect',
              '            let bubbleRect: CGRect?\n            let layoutSafeRect: CGRect?\n            let rect: CGRect',
              1,
          )
          anchor = '            let bubbleRect = rectValue(from: item["bubbleBox"] ?? item["bubble_box"])\n            let localPolygon'
          if anchor not in text:
              raise SystemExit('translation bubble parse anchor missing')
          text = text.replace(
              anchor,
              '            let bubbleRect = rectValue(from: item["bubbleBox"] ?? item["bubble_box"])\n            let layoutSafeRect = rectValue(from: item["layoutSafeRegion"] ?? item["layout_safe_region"])\n            let localPolygon',
              1,
          )
          text = text.replace(
              '                bubbleRect: bubbleRect,\n                rect: localRect,',
              '                bubbleRect: bubbleRect,\n                layoutSafeRect: layoutSafeRect,\n                rect: localRect,',
              1,
          )
          text = text.replace(
              'rects: parsedItems.flatMap { [$0.textRect, $0.bubbleRect, $0.rect].compactMap { $0 } },',
              'rects: parsedItems.flatMap { [$0.textRect, $0.bubbleRect, $0.layoutSafeRect, $0.rect].compactMap { $0 } },',
              1,
          )
          map_anchor = '            let mappedBubbleRect = normalizedBubbleRect.map { mapVisionRect($0, from: sourceRect) }\n            let normalizedRect'
          if map_anchor not in text:
              raise SystemExit('translation map anchor missing')
          text = text.replace(
              map_anchor,
              '            let mappedBubbleRect = normalizedBubbleRect.map { mapVisionRect($0, from: sourceRect) }\n            let normalizedLayoutSafeRect = item.layoutSafeRect.map { normalizeVisionRect($0, divisor: coordinateDivisor) }\n            let mappedLayoutSafeRect = normalizedLayoutSafeRect.map { mapVisionRect($0, from: sourceRect) }\n            let normalizedRect',
              1,
          )
          block_anchor = '                bubbleBox: mappedBubbleRect.flatMap { isUsableVisionRect($0) ? $0 : nil },\n                polygon: mappedTextPolygon,'
          if block_anchor not in text:
              raise SystemExit('translation block anchor missing')
          text = text.replace(
              block_anchor,
              '                bubbleBox: mappedBubbleRect.flatMap { isUsableVisionRect($0) ? $0 : nil },\n                layoutSafeRegion: mappedLayoutSafeRect.flatMap { isUsableVisionRect($0) ? $0 : nil },\n                polygon: mappedTextPolygon,',
              1,
          )

          # Recognition parse model and mapping.
          text = text.replace(
              '            let bubbleRect: CGRect?\n            let textPolygon: [CGPoint]',
              '            let bubbleRect: CGRect?\n            let layoutSafeRect: CGRect?\n            let textPolygon: [CGPoint]',
              1,
          )
          recognition_anchor = '                bubbleRect: rectValue(from: item["bubbleBox"] ?? item["bubble_box"]),\n                textPolygon:'
          if recognition_anchor not in text:
              raise SystemExit('recognition parse anchor missing')
          text = text.replace(
              recognition_anchor,
              '                bubbleRect: rectValue(from: item["bubbleBox"] ?? item["bubble_box"]),\n                layoutSafeRect: rectValue(from: item["layoutSafeRegion"] ?? item["layout_safe_region"]),\n                textPolygon:',
              1,
          )
          text = text.replace(
              '        let allRects = parsed.flatMap { [$0.textRect, $0.bubbleRect].compactMap { $0 } }',
              '        let allRects = parsed.flatMap { [$0.textRect, $0.bubbleRect, $0.layoutSafeRect].compactMap { $0 } }',
              1,
          )
          recog_map_anchor = '''            let validBubbleRect = normalizedBubbleRect.flatMap { rect -> CGRect? in
                let mapped = mapVisionRect(rect, from: sourceRect)
                return isUsableVisionRect(mapped) ? mapped : nil
            }
            guard let mappedRect'''
          recog_map_new = '''            let validBubbleRect = normalizedBubbleRect.flatMap { rect -> CGRect? in
                let mapped = mapVisionRect(rect, from: sourceRect)
                return isUsableVisionRect(mapped) ? mapped : nil
            }
            let validLayoutSafeRect = item.layoutSafeRect
                .map { normalizeVisionRect($0, divisor: coordinateDivisor) }
                .map { mapVisionRect($0, from: sourceRect) }
                .flatMap { isUsableVisionRect($0) ? $0 : nil }
            guard let mappedRect'''
          if recog_map_anchor not in text:
              raise SystemExit('recognition map anchor missing')
          text = text.replace(recog_map_anchor, recog_map_new, 1)
          recog_block_anchor = '                    bubbleBox: validBubbleRect,\n                    polygon: mappedTextPolygon,'
          if recog_block_anchor not in text:
              raise SystemExit('recognition block anchor missing')
          text = text.replace(
              recog_block_anchor,
              '                    bubbleBox: validBubbleRect,\n                    layoutSafeRegion: validLayoutSafeRect ?? validBubbleRect ?? mappedRect,\n                    polygon: mappedTextPolygon,',
              1,
          )

          # F12: deterministic, content-aware horizontal seams. Viewport aspect no longer changes boundaries.
          pattern = re.compile(r'''    private static func shouldSliceBeforeVision\(_ image: UIImage, viewportAspect: CGFloat\) -> Bool \{.*?\n    \}\n\n    private static func visionSlices\(from image: UIImage, viewportAspect: CGFloat\) -> \[VisionSlice\] \{.*?\n    \}\n\n    private static func parseVisionTranslationBlocks''', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('vision slicing block missing')
          replacement = r'''    private static func shouldSliceBeforeVision(_ image: UIImage, viewportAspect: CGFloat) -> Bool {
        guard let cgImage = image.cgImage, cgImage.width > 0 else { return false }
        _ = viewportAspect // slicing is image-driven so the same page is stable across viewport sizes.
        let ratio = CGFloat(cgImage.height) / CGFloat(cgImage.width)
        return ratio > 2.2
    }

    private static func horizontalSeamScores(for image: UIImage) -> [Double]? {
        guard let source = image.cgImage, source.width > 0, source.height > 0 else { return nil }
        let sampleWidth = min(max(source.width / 8, 64), 256)
        let sampleHeight = max(Int((Double(source.height) / Double(source.width) * Double(sampleWidth)).rounded()), 1)
        var pixels = [UInt8](repeating: 255, count: sampleWidth * sampleHeight)
        let rendered = pixels.withUnsafeMutableBytes { buffer -> Bool in
            guard let context = CGContext(
                data: buffer.baseAddress,
                width: sampleWidth,
                height: sampleHeight,
                bitsPerComponent: 8,
                bytesPerRow: sampleWidth,
                space: CGColorSpaceCreateDeviceGray(),
                bitmapInfo: CGImageAlphaInfo.none.rawValue
            ) else { return false }
            context.interpolationQuality = .low
            context.draw(source, in: CGRect(x: 0, y: 0, width: sampleWidth, height: sampleHeight))
            return true
        }
        guard rendered else { return nil }

        var scores = [Double](repeating: 0, count: sampleHeight)
        for y in 0..<sampleHeight {
            var sum = 0.0
            var sumSquares = 0.0
            var gradient = 0.0
            for x in 0..<sampleWidth {
                let value = Double(pixels[y * sampleWidth + x]) / 255.0
                sum += value
                sumSquares += value * value
                if y > 0 {
                    let previous = Double(pixels[(y - 1) * sampleWidth + x]) / 255.0
                    gradient += abs(value - previous)
                }
            }
            let count = Double(sampleWidth)
            let mean = sum / count
            let variance = max(sumSquares / count - mean * mean, 0)
            let edge = gradient / count
            // Prefer low-detail rows and, secondarily, light gutters. Uniform dark
            // separators still score far below text/line-art rows.
            scores[y] = variance * 1.4 + edge * 0.8 + (1 - mean) * 0.05
        }
        guard sampleHeight >= 3 else { return scores }
        return scores.indices.map { y in
            let lower = max(0, y - 1)
            let upper = min(sampleHeight - 1, y + 1)
            return scores[lower...upper].reduce(0, +) / Double(upper - lower + 1)
        }
    }

    private static func contentAwareHorizontalSeam(
        near target: Int,
        imageHeight: Int,
        imageWidth: Int,
        scores: [Double]?
    ) -> Int {
        guard let scores, scores.count > 1, imageHeight > 1 else { return target }
        let radius = max(Int(Double(imageWidth) * 0.28), 80)
        let lower = max(1, target - radius)
        let upper = min(imageHeight - 1, target + radius)
        guard lower < upper else { return min(max(target, 1), imageHeight - 1) }
        let span = max(upper - lower, 1)
        var best = target
        var bestScore = Double.greatestFiniteMagnitude
        for y in lower...upper {
            let sampleY = min(max(Int(Double(y) / Double(imageHeight) * Double(scores.count)), 0), scores.count - 1)
            let distancePenalty = Double(abs(y - target)) / Double(span) * 0.08
            let score = scores[sampleY] + distancePenalty
            if score < bestScore {
                bestScore = score
                best = y
            }
        }
        return best
    }

    private static func visionSlices(from image: UIImage, viewportAspect: CGFloat) -> [VisionSlice] {
        guard let cgImage = image.cgImage, cgImage.width > 0, cgImage.height > 0 else {
            return []
        }
        let width = cgImage.width
        let height = cgImage.height
        guard shouldSliceBeforeVision(image, viewportAspect: viewportAspect) else {
            return [VisionSlice(image: image, sourceRect: CGRect(x: 0, y: 0, width: 1, height: 1))]
        }

        let targetSliceHeight = min(max(Int(CGFloat(width) * 1.8), 1000), 3200)
        let overlap = max(Int(Double(targetSliceHeight) * 0.10), 96)
        let scores = horizontalSeamScores(for: image)
        var boundaries = [0]
        var cursor = 0
        while height - cursor > Int(Double(targetSliceHeight) * 1.25) {
            let target = min(cursor + targetSliceHeight, height - 1)
            var seam = contentAwareHorizontalSeam(
                near: target,
                imageHeight: height,
                imageWidth: width,
                scores: scores
            )
            let minimumAdvance = max(Int(Double(targetSliceHeight) * 0.62), 1)
            if seam - cursor < minimumAdvance {
                seam = min(cursor + minimumAdvance, height - 1)
            }
            guard seam > cursor else { break }
            boundaries.append(seam)
            cursor = seam
        }
        boundaries.append(height)

        var slices: [VisionSlice] = []
        for index in 0..<(boundaries.count - 1) {
            let coreStart = boundaries[index]
            let coreEnd = boundaries[index + 1]
            let y0 = max(0, coreStart - (index == 0 ? 0 : overlap / 2))
            let y1 = min(height, coreEnd + (index == boundaries.count - 2 ? 0 : overlap / 2))
            let currentHeight = max(y1 - y0, 1)
            let cropRect = CGRect(x: 0, y: CGFloat(y0), width: CGFloat(width), height: CGFloat(currentHeight))
            guard let cropped = cgImage.cropping(to: cropRect) else { continue }
            let normalized = CGRect(
                x: 0,
                y: CGFloat(y0) / CGFloat(height),
                width: 1,
                height: CGFloat(currentHeight) / CGFloat(height)
            )
            let croppedImage = UIImage(cgImage: cropped, scale: 1, orientation: image.imageOrientation)
            slices.append(VisionSlice(
                // Slices can afford a larger edge than the full-page overview,
                // retaining furigana/small captions without multiplying full-page cost.
                image: resizedImageForVision(croppedImage, maxDimension: 2560),
                sourceRect: normalized
            ))
        }
        return slices
    }

    static func visionSliceRectsForDiagnostics(
        _ image: UIImage,
        viewportAspect: CGFloat = 2.0
    ) -> [CGRect] {
        visionSlices(from: image, viewportAspect: viewportAspect).map(\.sourceRect)
    }

    private static func parseVisionTranslationBlocks'''
          text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)

          # Offline strict prompt uses the same F10 contract.
          p = Path('mreader/OfflineTranslationPrompt.swift')
          s = p.read_text()
          s = s.replace('static let revision = "offline-vision-v4-context"', 'static let revision = "offline-vision-v5-region-semantics"', 1)
          s = s.replace(
              '每个 item 必须包含 sourceText、translation、textBox、bubbleBox、confidence、classification。id、translationLines、textPolygon、bubblePolygon 都是可选字段；不要使用 text、lines、polygon 或任何别名。',
              '每个 item 必须包含 sourceText、translation、textBox、layoutSafeRegion、confidence、classification。bubbleBox、id、translationLines、textPolygon、bubblePolygon 都是可选字段；不要使用 text、lines、polygon 或任何别名。',
              1,
          )
          s = s.replace(
              'textBox 是紧贴原文字的必填字段，用于原文字号与位置；bubbleBox 只表示译文可扩展到的最大范围，不能代替 textBox。polygon 若提供，分别对应两个框。',
              'textBox 是紧贴原文字的必填字段；bubbleBox 只表示真实物理气泡，没有气泡的拟声词必须省略；layoutSafeRegion 是独立的安全排版区域，即使没有物理气泡也必须提供。polygon 若提供，分别对应真实文字与物理气泡。',
              1,
          )
          s = s.replace(
              '"bubbleBox":{"x":0.08,"y":0.18,"width":0.24,"height":0.12},"confidence"',
              '"bubbleBox":{"x":0.08,"y":0.18,"width":0.24,"height":0.12},"layoutSafeRegion":{"x":0.09,"y":0.19,"width":0.22,"height":0.10},"confidence"',
              1,
          )
          p.write_text(s)
          PY
          rm .github/workflows/phase4-model-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mreader/AITranslator.swift mreader/OfflineTranslationPrompt.swift .github/workflows/phase4-model-patch.yml
          git commit -m 'feat: separate translation regions and add content-aware slicing'
          git push origin HEAD:codex/translation-comic-integration
