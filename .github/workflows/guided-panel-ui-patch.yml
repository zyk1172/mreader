name: Guided Panel UI Patch

on:
  push:
    branches: ["feature/guided-panel-v1"]

permissions:
  contents: write

jobs:
  patch-reader-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guided-panel-v1
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_guided_panel_ui.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader/ReaderView.swift
          git commit -m "feat: expose Guided Panel test action"
          git push origin HEAD:feature/guided-panel-v1
