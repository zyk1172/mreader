name: Translation Readability Patch

on:
  push:
    branches:
      - codex/translation-readability-typesetter
    paths:
      - .github/translation-readability-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/translation-readability-typesetter

      - name: Apply patch
        run: python3 .github/translation-readability-patch.py

      - name: Validate whitespace
        run: git diff --check

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mreader mreaderTests
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: enforce translation readability contract"
          git push origin HEAD:codex/translation-readability-typesetter
