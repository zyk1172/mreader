name: Manga Vision Validate

on:
  push:
    branches:
      - feature/manga-vision-layer
    paths:
      - mreader/**
      - mreaderTests/**
      - .github/workflows/manga-vision-validate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manga-vision-validate
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.5.app/Contents/Developer
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Resolve packages
        run: xcodebuild -project mreader.xcodeproj -scheme mreader -resolvePackageDependencies
      - name: Build for testing
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build-for-testing
