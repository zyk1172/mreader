name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.5.app/Contents/Developer
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

jobs:
  build-and-test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check whitespace
        run: git diff --check

      - name: Select Xcode and inspect simulator runtimes
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Materialize private Manga Vision weight
        env:
          MREADER_MODEL_DEPLOY_KEY: ${{ secrets.MREADER_MODEL_DEPLOY_KEY }}
          MREADER_MODEL_TOKEN: ${{ secrets.MREADER_MODEL_READ_TOKEN }}
        run: bash scripts/materialize_private_model_weight.sh

      - name: Resolve Swift packages
        run: xcodebuild -project mreader.xcodeproj -scheme mreader -resolvePackageDependencies

      - name: Build unit-test bundle
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build-for-testing

      - name: Build Release app
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MReaderReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build

      - name: Run Manga Vision regression gate
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            -only-testing:mreaderTests/MangaVisionRegressionGateTests \
            -resultBundlePath "$RUNNER_TEMP/MangaVisionRegressionGate.xcresult" \
            test-without-building

      - name: Run unit tests
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            -only-testing:mreaderTests \
            -skip-testing:mreaderTests/MangaVisionRegressionGateTests \
            -resultBundlePath "$RUNNER_TEMP/MReaderUnitTests.xcresult" \
            test-without-building

      - name: Upload unit test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mreader-unit-test-results
          path: |
            ${{ runner.temp }}/MangaVisionRegressionGate.xcresult
            ${{ runner.temp }}/MReaderUnitTests.xcresult
            ${{ runner.temp }}/MReaderDerivedData/Logs/Test/
          if-no-files-found: warn

  ui-smoke:
    name: UI smoke tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode and inspect simulator runtimes
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Materialize private Manga Vision weight
        env:
          MREADER_MODEL_DEPLOY_KEY: ${{ secrets.MREADER_MODEL_DEPLOY_KEY }}
          MREADER_MODEL_TOKEN: ${{ secrets.MREADER_MODEL_READ_TOKEN }}
        run: bash scripts/materialize_private_model_weight.sh

      - name: Resolve Swift packages
        run: xcodebuild -project mreader.xcodeproj -scheme mreader -resolvePackageDependencies

      - name: Build UI-test bundle
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build-for-testing

      - name: Run UI smoke tests
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            -only-testing:mreaderUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath "$RUNNER_TEMP/MReaderUISmoke.xcresult" \
            test-without-building

      - name: Upload UI test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mreader-ui-smoke-results
          path: |
            ${{ runner.temp }}/MReaderUISmoke.xcresult
            ${{ runner.temp }}/MReaderDerivedData/Logs/Test/
          if-no-files-found: warn
