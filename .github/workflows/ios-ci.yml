name: Temporary Shirohage gold review overlay

on:
  push:
    branches:
      - codex/translation-gold-review

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Render numbered candidate regions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          image_path = Path('mreaderTests/Fixtures/sample_shirohage_manga.jpg')
          gold_path = Path('mreaderTests/Fixtures/sample_shirohage_manga.gold.json')
          output_path = Path('docs/shirohage-gold-review-overlay.png')

          image = Image.open(image_path).convert('RGB')
          width, height = image.size
          draw = ImageDraw.Draw(image)
          font = ImageFont.load_default(size=32)
          regions = sorted(json.loads(gold_path.read_text())['regions'], key=lambda item: item['readingOrder'])

          line_width = max(5, round(min(width, height) * 0.0025))
          for index, region in enumerate(regions, start=1):
              rect = region['rect']
              x1 = round(rect['x'] * width)
              y1 = round(rect['y'] * height)
              x2 = round((rect['x'] + rect['width']) * width)
              y2 = round((rect['y'] + rect['height']) * height)
              draw.rectangle((x1, y1, x2, y2), outline=(220, 32, 32), width=line_width)

              label = str(index)
              bbox = draw.textbbox((0, 0), label, font=font, stroke_width=1)
              label_width = bbox[2] - bbox[0] + 18
              label_height = bbox[3] - bbox[1] + 14
              label_x = max(0, min(x1, width - label_width))
              label_y = max(0, y1 - label_height)
              draw.rectangle(
                  (label_x, label_y, label_x + label_width, label_y + label_height),
                  fill=(220, 32, 32)
              )
              draw.text(
                  (label_x + 9, label_y + 5),
                  label,
                  fill=(255, 255, 255),
                  font=font,
                  stroke_width=1,
                  stroke_fill=(255, 255, 255)
              )

          output_path.parent.mkdir(parents=True, exist_ok=True)
          image.save(output_path, format='PNG', optimize=True)
          print(f'rendered {len(regions)} regions on {width}x{height} source')
          PY

      - name: Commit overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shirohage-gold-review-overlay.png
          git commit -m "docs: add Shirohage gold review overlay"
          git push origin HEAD:codex/translation-gold-review
