name: Codex translation presentation patch

on:
  push:
    branches:
      - codex/translation-style-guided-focus
    paths:
      - .github/workflows/codex-translation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/translation-style-guided-focus
          fetch-depth: 0
      - name: Apply source patch
        run: python3 .github/codex_translation_patch.py
      - name: Commit source patch
        run: |
          rm .github/workflows/codex-translation-patch.yml
          rm .github/codex_translation_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine translation presentation settings and typography"
          git push origin HEAD:codex/translation-style-guided-focus
