name: Capture first page baseline from xcresult

on:
  push:
    branches:
      - codex/translation-first-page-baseline
    paths:
      - .github/workflows/apply-first-page-baseline-xcresult.yml

permissions:
  contents: write

env:
  XCODE_PATH: /Applications/Xcode_26.5.app/Contents/Developer
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: codex/translation-first-page-baseline

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -project mreader.xcodeproj -scheme mreader -resolvePackageDependencies

      - name: Build tests
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderBaselineDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build-for-testing

      - name: Run real-page baseline into xcresult
        env:
          MREADER_RUN_PAGE_BENCHMARK: "1"
        run: |
          xcodebuild \
            -project mreader.xcodeproj \
            -scheme mreader \
            -configuration Debug \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/MReaderBaselineDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            -only-testing:mreaderTests/TranslationFirstPageBaselineTests/testGenerateShirohagePageBaselineWhenOptedIn \
            -resultBundlePath "$RUNNER_TEMP/MReaderPageBaseline.xcresult" \
            test-without-building

      - name: Export XCTest attachments
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-attachments"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/MReaderPageBaseline.xcresult" \
            --output-path "$RUNNER_TEMP/baseline-attachments"
          find "$RUNNER_TEMP/baseline-attachments" -type f -maxdepth 3 -print

      - name: Persist baseline and candidate fixtures
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path.cwd()
          exported = pathlib.Path("${{ runner.temp }}/baseline-attachments")
          fixtures = root / "mreaderTests" / "Fixtures"

          report = None
          candidate = None
          for path in exported.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  payload = json.loads(path.read_text())
              except Exception:
                  continue
              if payload.get("sampleID") != "manga-page-shirohage-ja":
                  continue
              if "rawCount" in payload and "lineBlocks" in payload:
                  report = payload
              elif payload.get("verificationStatus") == "candidate" and "regions" in payload:
                  candidate = payload

          if report is None:
              raise SystemExit("baseline report attachment not found in xcresult export")
          if candidate is None:
              raise SystemExit("candidate gold attachment not found in xcresult export")

          baseline_path = fixtures / "sample_shirohage_manga.baseline.json"
          candidate_path = fixtures / "sample_shirohage_manga.gold.json"
          baseline_path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n")
          candidate_path.write_text(json.dumps(candidate, ensure_ascii=False, indent=2, sort_keys=True) + "\n")

          manifest_path = fixtures / "translation_quality_manifest.json"
          manifest = json.loads(manifest_path.read_text())
          for sample in manifest["samples"]:
              if sample["id"] == "manga-page-shirohage-ja":
                  sample["annotationStatus"] = "pending"
                  sample["goldAnnotation"] = candidate_path.name
                  sample["notes"] = (
                      "Pinned simulator baseline captured from the actual MangaOCRPipeline. "
                      "The linked page annotation remains a machine-assisted candidate and "
                      "must be human-verified before the sample may become ready."
                  )
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps({
              "detectedLanguage": report.get("detectedLanguage"),
              "rawCount": report.get("rawCount"),
              "resolvedCount": report.get("resolvedCount"),
              "lineCount": report.get("lineCount"),
              "bubbleCount": report.get("bubbleCount"),
              "rejectedCount": report.get("rejectedCount"),
              "elapsedMilliseconds": report.get("elapsedMilliseconds"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit captured fixtures and remove helper workflow
        run: |
          rm .github/workflows/apply-first-page-baseline-xcresult.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: persist first real manga page baseline"
          git push origin HEAD:codex/translation-first-page-baseline
