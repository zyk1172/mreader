name: Phase 3 Translation Patch

on:
  push:
    branches:
      - codex/translation-context-recovery

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/translation-context-recovery
          fetch-depth: 0
      - name: Apply phase 3 patch
        run: python3 scripts/apply_phase3_translation_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add translation context and OCR recovery"
            git push origin HEAD:codex/translation-context-recovery
          fi
