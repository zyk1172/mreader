name: Repair Guided Panel v2 patch workflow

on:
  push:
    branches:
      - feat/guided-panel-vision-motion-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guided-panel-vision-motion-v2
          fetch-depth: 0
      - name: Relax duplicate-safe replacement and hand off
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/guided-panel-v2-patch.yml')
          text = path.read_text()
          text = text.replace("    if: github.actor != 'github-actions[bot]'\n", "")
          text = text.replace("              if count != 1:\n", "              if count < 1:\n")
          text = text.replace("              p.write_text(text.replace(old, new, 1))\n", "              p.write_text(text.replace(old, new))\n")
          path.write_text(text)
          Path('.github/workflows/repair-guided-panel-v2-workflow.yml').unlink()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair Guided Panel v2 patch runner"
          git push origin HEAD:feat/guided-panel-vision-motion-v2
